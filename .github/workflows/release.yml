name: release

# A version tag triggers the FULL product build (build.ps1 all lanes:
# contracts → engine → ui+tauri → NSIS installer → portable zip →
# checksums), runs the whole validation stack, and uploads every artifact
# with SHA256SUMS + truthful release notes.
#
# THE PRODUCT IS USER-MODE ONLY (consolidation session): no kernel driver,
# no service, no certificate-store changes. build.ps1 self-signs the engine
# kit (cr_ui.dll, rrecov.exe) and the installer with the EPHEMERAL build
# certificate (installer/devsign.ps1 - a fresh certificate per build,
# nothing committed, docs/DEV-SIGNING.md). A self-signed Authenticode
# signature is an integrity marker, not a load prerequisite - nothing needs
# a trust-anchor decision on the target machine. PRODUCTION signing
# (a real CA certificate) remains pending - the notes state it.
#
# Reproducibility: same tag → same artifacts (byte-identical modulo
# timestamps and the per-run certificate); the version source of truth is
# the root VERSION file and the tag MUST match it (the workflow refuses
# otherwise).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # release upload

jobs:
  full-product:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version gate — tag must equal the VERSION file
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$version") {
            Write-Error "tag $tag != VERSION v$version - the version source of truth is the VERSION file"
            exit 1
          }
          Write-Host "version gate: $tag == v$version"

      - name: Contracts gate (boundary truth)
        run: node contracts/validate.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable

      - name: Full product build (all lanes + installer + portable + checksums)
        shell: pwsh
        run: |
          $env:CR_UI_LIB_DIR = ""   # build.ps1 stages the kit and sets this itself
          ./build.ps1 -Target all
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify every expected artifact exists + carries the dev signature
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expected = @(
            "build\out\RecoveryWizard-$version-setup.exe",
            "build\out\RecoveryWizard-$version-portable.zip",
            "build\out\SHA256SUMS"
          )
          foreach ($p in $expected) {
            if (-not (Test-Path $p)) { Write-Error "missing artifact: $p"; exit 1 }
          }
          # The development signature is a product requirement: the installer
          # and the engine kit must carry the build certificate.
          $stage = "build\out\stage-$version"
          $devsign = "installer\devsign.ps1"
          & $devsign -Action verify -File "build\out\RecoveryWizard-$version-setup.exe"
          if (-not $?) { Write-Error "the installer carries no development signature"; exit 1 }
          & $devsign -Action verify -File "$stage\engine\cr_ui.dll"
          if (-not $?) { Write-Error "cr_ui.dll carries no development signature"; exit 1 }
          Write-Host "artifacts present + development-signed:"
          Get-ChildItem build\out | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Compose truthful release notes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $sums = Get-Content build\out\SHA256SUMS -Raw
          @"
          # Recovery Wizard $version

          Combined installer for the recovery product: application (Tauri shell)
          and the native recovery engine (cr_ui) — one product, one install,
          standard locations (Program Files / ProgramData; docs/ARCHITECTURE.md).

          ## A user-mode product with direct raw-disk access

          Recovery Wizard is a **user-mode application**. It reads and writes
          disks and volumes directly from user mode — no kernel driver, no
          service, no certificate changes; nothing is loaded into the operating
          system, and uninstalling removes everything the installer placed.

          **The application requests the administrator token at launch.** Its
          embedded manifest carries requireAdministrator — one standard UAC
          prompt when it starts, none mid-session (the same posture as the
          reference product). Scanning, recovering, health checks and repairs
          open physical drives and volumes directly and need the token; a
          non-elevated context (an edge case, e.g. a stripped token) is refused
          truthfully — never a degraded mode, never a silent failure.

          ## What changed in this release

          This is the debug-and-release release: every surface reported
          broken on the installed product was reproduced on real Windows,
          root-caused, fixed at the source, and re-gated. 0.9.1 is the
          patch cut over 0.9.0: the two defects the 0.9.0 validation run
          itself caught are fixed (the deep scan phase's frozen progress
          and the many-volume enumeration failure); everything else
          carries over from 0.9.0.

          - **The app now requests administrator at launch.** Through
            v0.8.4 the exe carried no manifest at all — it launched
            unelevated and deferred elevation to an in-app restart prompt
            (which also rendered off-theme). The embedded
            requireAdministrator manifest gives one standard UAC prompt at
            launch and none mid-session; the restart-prompt surface is
            gone (the reference product ships the same posture).
          - **No console window on disk health.** Every health read used
            to spawn a visible cmd.exe console (a CRT pipe-spawn regression
            from the engine re-merge). The TRIM query now runs fsutil
            directly, hidden, with a bounded wait — and a build-time
            tree-wide guard keeps every console-spawn out of the shipped
            engine.
          - **Every physical disk appears on the landing page.** The home
            screen previously listed internal drives only and hid every
            USB/SD/removable-bus device behind an unreachable view. The
            page now renders the reference layout: "Internal drives (N)"
            and "External drives (N)" together; SD cards stay first-class
            on their dedicated page.
          - **(0.9.1) The deep scan phase moves too.** The 0.9.0
            validation run caught a 655-second stretch on a 64 GB NTFS
            volume where percent, found-count and the sector counter all
            stood still — the deep stage's remnant sweep reported progress
            only once per multi-gigabyte chunk (and not at all on
            single-threaded runs). It now reports coverage every 4 MiB:
            the status line stays live through the whole scan, and a Stop
            lands within the checkpoint bound.
          - **(0.9.1) Machines with many mounted volumes keep their
            device list.** A fixed-size volume-enumeration buffer failed
            wholesale at 16+ drive letters (developer machines with VHDs,
            containers, card readers lost every volume row); the
            enumeration now sizes itself to the system's answer.
          - **The scan really scans — visibly.** The "jumps to 75%,
            files found N (0 B), no sector progress, all stuck" symptom is
            fixed at its four roots: the carve stage now checkpoints
            progress inside each work window (the percent and the sector
            counter move continuously, and a Stop is observed within the
            checkpoint bound instead of after a multi-minute grind), the
            found-data SIZE rides the live event stream (the "0 B" gap is
            gone — "Files Found: N (size)" grows live), the counters
            update from the engine's live tree state, and completion
            surfaces the instant the engine latches it (no 500 ms poll
            wait).
          - **Closing the window on a running scan now asks.** The app
            previously exited and lost the in-flight session; the
            close guard offers Save-and-exit / Keep scanning /
            Exit-without-saving, backed by a real session save.
          - **Smaller truth fixes:** the About dialog no longer badges the
            real backend as the test double; the results context menu's
            "Open location" actually opens the location (or explains why
            a lost file cannot); the user-signature import reads the real
            file contents; the session-save and session-load buttons show
            real progress; the results tree grows live while scanning.
          - **The validation gates now assert the fixed posture** — the
            release pipeline refuses to build without the manifest, the
            forensic probe refuses an asInvoker install, an unelevated
            start, a missing device row, a frozen scan, or a zero-size
            found counter.
          - Carried from the 0.8.x line: whole-disk session resume on
            identical-model-disk hosts (0.8.4), the visible resume route
            (0.8.3), the stopped-early banner fix (0.8.2), the
            "(no volume label)" session rows (0.8.1), the visible refused
            save (0.8.0). For the 0.6.x driver-era history see the 0.7.0
            release notes.

          ## Signing status (truthful)

          This release is **development self-signed**, not production-signed:

          - The engine kit (``cr_ui.dll``, ``rrecov.exe``) and the installer
            (``-setup.exe``) are embed-signed with an ephemeral self-signed
            development certificate generated at build time
            (docs/DEV-SIGNING.md). Nothing private is shipped or committed, and
            NO certificate is imported anywhere by the installer.
          - The Tauri application bundle is not signed yet (the
            production-signing gap documented in docs/DEV-SIGNING.md);
            SmartScreen may warn on first run. Production signing (a real CA
            certificate) remains pending.

          ## Artifacts

          - ``RecoveryWizard-$version-setup.exe`` — the combined NSIS installer
            (engine + app; all-users; uninstall removes everything, sessions
            kept by default with explicit consent).
          - ``RecoveryWizard-$version-portable.zip`` — app + engine, no
            install: run the executable as administrator; sessions and logs
            are written beside it.
          - ``SHA256SUMS`` — checksums for every artifact.

          ## Checksums

          ``````
          $sums
          ````
          "@ | Set-Content -Path release-notes.md -Encoding UTF8

      - name: Upload artifacts to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          files: |
            build/out/RecoveryWizard-*-setup.exe
            build/out/RecoveryWizard-*-portable.zip
            build/out/SHA256SUMS
          fail_on_unmatched_files: true

      - name: Upload build log artifacts (evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-evidence
          # NG-17: EXCLUDE the ephemeral signing material — the previous
          # `path: build/out/` uploaded stage-<v>/devsign.pfx + its password
          # file into a 14-day workflow artifact (never published to the
          # release, but the secret has no business in any artifact).
          path: |
            build/out/*
            !build/out/stage-*/
            !build/out/devsign.*
          retention-days: 14
