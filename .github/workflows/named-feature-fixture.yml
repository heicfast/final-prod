name: named-feature-fixture

# Dispatch-only evidence lane (session: cross-repo harvest, T5): builds the
# seeded named-feature fixture on a REAL Windows runner — a 2 GB GPT/NTFS
# VHDX created via diskpart (the tools/forensic/seed-disks.ps1 pattern) —
# proves generator determinism (two generations, identical manifests modulo
# the _meta line), applies the deletion matrix with volume flushes, runs the
# verifier self-test, detaches, and uploads the VHDX + manifest + logs as
# artifacts. The VHDX is the seeded ground-truth image later lanes scan
# (Wave 5 validation); it is NEVER remounted-and-written after the deletion
# flush (the testlab lesson).
#
# This lane is dispatch-only by design: it never runs on push, so main's
# push lanes stay untouched by fixture work.

on:
  workflow_dispatch:

concurrency:
  group: named-feature-fixture-${{ github.ref }}
  cancel-in-progress: false # evidence runs queue; nothing in flight is dropped

permissions:
  contents: read

jobs:
  fixture:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build seeded fixture VHDX (generate, determinism proof, delete, verify self-test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'nffx'
          $evidence = Join-Path $work 'evidence'
          New-Item -ItemType Directory -Force -Path $work, $evidence | Out-Null
          Start-Transcript -Path (Join-Path $evidence 'lane-transcript.txt') | Out-Null
          try {
            # --- 1. create + attach the VHDX (seed-disks.ps1 pattern) ------
            $vhdx = Join-Path $work 'named-feature-fixture.vhdx'
            $dp = Join-Path $work 'dp-create.txt'
            @(
              "create vdisk file=`"$vhdx`" type=expandable maximum=2048",
              "select vdisk file=`"$vhdx`"",
              'attach vdisk',
              'convert gpt',
              'create partition primary',
              'format fs=ntfs label="NFFX" quick',
              'assign letter=X'
            ) | Set-Content -Path $dp -Encoding ASCII
            $out = & diskpart /s $dp 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { throw "diskpart create failed (exit $LASTEXITCODE)" }
            $okCount = ([regex]::Matches($out, 'DiskPart successfully')).Count
            if ($okCount -lt 5) { throw "diskpart reported only $okCount successes (expected >= 5)" }

            # --- 2. generate the fixture twice: determinism proof ----------
            # D-LANE-01 (the 44380763554 engine-flow red): the second
            # generation now runs on the RUNNER's scratch disk, never on
            # the evidence VHDX. The proof compares MANIFEST BYTES (a pure
            # function of the generator + seed - same tree, same PRNG
            # content), not on-disk placement; generating it on X: left a
            # second deleted tree in the MFT whose clusters the expandable
            # VHDX zero-fills after Remove-Item, so the engine-flow scan
            # recovered an unaccounted all-zero duplicate tree and the
            # verifier failed I1/I2/I4 on files the manifest never
            # described. One generation on the VHDX = the scan sees exactly
            # the manifest-known tree.
            # D-ROOT-01 (the 44391734922 engine-flow red): the fixture
            # seeds at the VOLUME ROOT (X:\), not X:\fixture - volume-
            # relative paths (what the engine reconstructs) then equal
            # manifest rel paths (what the verifier expects) exactly, with
            # no 'fixture/' component the verifier would have to strip.
            $m1 = Join-Path $evidence 'manifest.jsonl'
            $m2 = Join-Path $work 'manifest-detcheck.jsonl'
            $detRoot = Join-Path $env:RUNNER_TEMP 'nffx-detcheck'
            New-Item -ItemType Directory -Force -Path $detRoot | Out-Null
            # pwsh (PS7): reads UTF-8 (BOM) scripts natively; PS5.1 would also
            # work with the BOM, PS7 is the lane's shell anyway
            & pwsh -NoProfile -File tools/validation/named-feature/generate-fixture.ps1 -Root 'X:\' -ManifestOut $m1
            if ($LASTEXITCODE -ne 0) { throw "generate-fixture run 1 failed" }
            & pwsh -NoProfile -File tools/validation/named-feature/generate-fixture.ps1 -Root (Join-Path $detRoot 'fxroot') -ManifestOut $m2
            if ($LASTEXITCODE -ne 0) { throw "generate-fixture run 2 failed" }
            $a = Get-Content $m1 | Select-Object -Skip 1   # skip _meta (root/timestamp differ by design)
            $b = Get-Content $m2 | Select-Object -Skip 1
            $diff = Compare-Object -ReferenceObject $a -DifferenceObject $b
            if ($diff) {
              $diff | Format-Table | Out-String | Write-Host
              throw "determinism FAILED: manifests differ beyond the _meta line"
            }
            Write-Host 'determinism PROOF: two generations byte-identical (modulo _meta; run 2 on the runner scratch disk - the VHDX keeps exactly one generation)'
            Remove-Item -Recurse -Force -LiteralPath $detRoot -ErrorAction SilentlyContinue

            # --- 3. apply the deletion matrix ------------------------------
            $applyLog = Join-Path $evidence 'apply-log.json'
            & pwsh -NoProfile -File tools/validation/named-feature/apply-deletions.ps1 -Root 'X:\' -ManifestOut $m1 -LogOut $applyLog
            if ($LASTEXITCODE -ne 0) { throw "apply-deletions failed" }

            # --- 4. verifier self-test -------------------------------------
            & python tools/validation/named-feature/verify-reconstruction.py --self-test | Tee-Object -FilePath (Join-Path $evidence 'verify-selftest.txt')
            if ($LASTEXITCODE -ne 0) { throw 'verifier self-test FAILED' }

            # --- 5. final flush before detach (no remount afterwards) ------
            Write-VolumeCache -DriveLetter X -ErrorAction SilentlyContinue
          }
          finally {
            Stop-Transcript | Out-Null
            # detach so the VHDX keeps its post-deletion state untouched
            $vhdx = Join-Path $work 'named-feature-fixture.vhdx'
            if (Test-Path $vhdx) {
              $dpd = Join-Path $work 'dp-detach.txt'
              "select vdisk file=`"$vhdx`"", 'detach vdisk' | Set-Content -Path $dpd -Encoding ASCII
              & diskpart /s $dpd 2>&1 | Out-String | Write-Host
            }
          }

      - name: Upload evidence + seeded VHDX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: named-feature-fixture
          path: |
            ${{ runner.temp }}/nffx/evidence/**
            ${{ runner.temp }}/nffx/named-feature-fixture.vhdx
          if-no-files-found: error
          retention-days: 90

  # --- F-01 closed loop (Wave 5 validation) ---------------------------------
  # The real engine over the seeded ground truth: build rrecov, scan the
  # detached VHDX (whole-disk, full quick+deep+carve), reconstruct the
  # deleted tree with the named feature's semantics, and hand the output
  # to the byte-for-byte verifier (I1-I5). The VHDX is read as an IMAGE
  # (never remounted - the testlab lesson); the reconstruct runs with the
  # SF scheme (rrecov recover --reconstruct-deleted).
  engine-flow:
    needs: fixture
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable git long paths
        shell: pwsh
        working-directory: .
        run: git config --system core.longpaths true

      - name: vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-bin-win2022-${{ hashFiles('engine/vcpkg.json') }}
          restore-keys: vcpkg-bin-win2022-

      - name: Build rrecov (win-x64-release)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          if (-not $env:VCPKG_ROOT) { Write-Host '::error::VCPKG_INSTALLATION_ROOT not set'; exit 1 }
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake --preset win-x64-release
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::configure failed'; exit 1 }
          cmake --build --preset win-x64-release --target rrecov
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::rrecov build failed (MSVC /W4 /WX)'; exit 1 }

      - name: Download the seeded fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: named-feature-fixture
          path: ${{ runner.temp }}/nffx

      - name: Scan + reconstruct-deleted + byte-for-byte verify (I1-I5)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rrecov = (Resolve-Path 'build\win-x64-release\src\app\Release\rrecov.exe').Path
          if (-not (Test-Path $rrecov)) { throw "missing $rrecov" }
          $nffx = Join-Path $env:RUNNER_TEMP 'nffx'
          $vhdx = Join-Path $nffx 'named-feature-fixture.vhdx'
          $evidence = Join-Path $nffx 'engine-flow'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $manifest = Join-Path $nffx 'evidence\manifest.jsonl'
          $session = Join-Path $evidence 'scan.crsf'
          $out = Join-Path $evidence 'reconstructed'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # 1. full scan of the detached VHDX (whole-disk: GPT + NTFS via
          #    the lost-partition machinery; quick+deep+carve defaults)
          $scanLog = & $rrecov scan --image $vhdx --whole-disk --out $session 2>&1 | Out-String
          $scanLog | Set-Content -Path (Join-Path $evidence 'scan-log.txt') -Encoding UTF8
          Write-Host $scanLog
          if ($LASTEXITCODE -ne 0) { throw "scan --image exited $LASTEXITCODE" }

          # 2. the named feature: deleted-only reconstruction with the
          #    original directory structure (SF semantics; SfId scheme)
          $reportJson = Join-Path $evidence 'recovery-report.json'
          $recLog = & $rrecov recover --in $session --image $vhdx --to $out --reconstruct-deleted --report $reportJson 2>&1 | Out-String
          $recLog | Set-Content -Path (Join-Path $evidence 'reconstruct-log.txt') -Encoding UTF8
          Write-Host $recLog
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { throw "reconstruct-deleted exited $LASTEXITCODE (2 = per-item failures - the verifier is the judge)" }

          # 3. the byte-for-byte judge: I1 deleted-only, I2 exactness,
          #    I3 collision-set, I4 accountability, I5 containment
          $verifyJson = Join-Path $evidence 'verify-report.json'
          $verifyTxt = Join-Path $evidence 'verify-output.txt'
          & python ..\tools\validation\named-feature\verify-reconstruction.py --manifest $manifest --out $out --report $verifyJson | Tee-Object -FilePath $verifyTxt
          if ($LASTEXITCODE -ne 0) { throw 'VERIFIER FAILED - see verify-report.json (never masked)' }
          Write-Host 'F-01 ENGINE-FLOW VERDICT: PASS (I1-I5 green on the seeded ground truth)'

      - name: Upload engine-flow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: named-feature-engine-flow
          path: ${{ runner.temp }}/nffx/engine-flow/**
          if-no-files-found: warn
          retention-days: 90
