name: validation-evidence

# T14 + T15 (docs/INTEGRATION-VALIDATION.md "Pending evidence"): measured
# latency/throughput against the retired simulator's documented budgets, the
# G-7 filter cost over the bridge metadata cache at 10^5/10^6 scales, memory
# bounds, and the installer runtime matrix (install / uninstall / update /
# repair) on a clean Windows runner.
#
# MANDATORY DRIVER + DEVELOPMENT TEST-SIGNING (2026-10-27): the T14 lane
# now builds, development-signs, and LOADS the RDA driver on the runner
# (hosted Windows images are built with `bcdedit /set TESTSIGNING ON` -
# actions/runner-images build.windows-2022.pkr.hcl - so an embed-signed
# driver loads after the certificate import), then the harness measures the
# REAL product path: every open/scan rides \.\RDA. The T15 matrix expects
# the installed product's driver service RUNNING with the certificate in
# Root + TrustedPublisher, and expects the uninstall to remove it.
#
# workflow_dispatch ONLY: the numbers are runner-dependent, so every run is
# recorded deliberately — the artifacts are downloaded, reviewed, and
# committed under docs/INTEGRATION-VALIDATION/ by hand (the workflow itself
# never pushes; contents: read).
#
# No masking: a leg that cannot run fails the run (installer-matrix.ps1
# throws on any failing row; the harness exits nonzero on a hard phase
# failure; unavailable phases are RECORDED as unavailable, never skipped
# silently).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t14-measurements:
    name: T14 engine latency + bridge filter/memory measurements
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The driver lane needs the WDK build stack (the engine lane needs
      # only cmake + vcpkg, which the runner image carries).
      - uses: nuget/setup-nuget@v2

      - uses: microsoft/setup-msbuild@v2

      - name: Engine kit + driver (build.ps1 lanes; contracts gate runs inside)
        shell: pwsh
        run: |
          # engine tests are engine-ci's lane; the driver lane is here so
          # the harness can run against the REAL mandatory transport.
          ./build.ps1 -Target engine -SkipTests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./build.ps1 -Target driver
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Load the development-signed RDA driver (the mandatory transport)
        shell: pwsh
        run: |
          # The mandatory-driver product path: import the build certificate,
          # register the service via the driver's own install.ps1, start it,
          # and PROVE \\.\RDA opens. Hosted Windows runners are imaged with
          # TESTSIGNING ON (actions/runner-images; verified by the bcdedit
          # evidence below), so the embed-signed driver loads here. Record
          # everything - the evidence must show WHY any step could fail.
          # (try/catch is a STATEMENT - it cannot sit inside a hash-literal
          # value; compute first, then build the record. Run 40434938050's
          # ParserError taught this.)
          $version = (Get-Content VERSION -Raw).Trim()
          $stage = "build\out\stage-$version"
          $sbState = try { Confirm-SecureBootUEFI } catch { "unavailable: $($_.Exception.Message)" }
          $tsState = (bcdedit | Select-String 'testsigning') -join '; '
          $osCaption = (Get-CimInstance Win32_OperatingSystem).Caption
          $info = [ordered]@{
            secureBoot   = "$sbState"
            testSigning = "$tsState"
            os          = "$osCaption"
          }
          & "installer\devsign.ps1" -Action install-cert -CerPath "$stage\driver\rda-testcert.cer"
          if (-not $?) { Write-Error "certificate import failed"; exit 1 }
          $info.certImported = $true
          if (Get-Service -Name RDA -ErrorAction SilentlyContinue) {
            & "driver\scripts\uninstall.ps1" -ServiceName RDA
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$stage\driver\install.ps1" -ServiceName RDA -Source "$stage\driver\rda.sys"
          if ($LASTEXITCODE -ne 0) { Write-Error "driver install.ps1 failed ($LASTEXITCODE)"; exit 1 }
          Start-Sleep -Seconds 2
          $svc = Get-Service -Name RDA -ErrorAction SilentlyContinue
          $info.serviceStatus = if ($svc) { "$($svc.Status)" } else { 'missing' }
          if (-not $svc -or $svc.Status -ne 'Running') {
            # the load refused: record the kernel-side reason from the System log
            $info.systemLog = Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddMinutes(-5)} `
              -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'RDA|driver' } |
              Select-Object -First 5 TimeCreated, Id, Message | Format-List | Out-String
            $info | ConvertTo-Json -Depth 4 | Set-Content t14-driver-info.json
            Write-Host ($info | ConvertTo-Json -Depth 4)
            Write-Error "the mandatory driver is not Running - the harness cannot measure the real transport"
            exit 1
          }
          # PROVE the control device opens - the engine's own probe semantics
          # (cr_transport.cpp rda_available: a bare CreateFileW on \\.\RDA).
          Add-Type -Namespace Win32 -Name Native -MemberDefinition '[DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern IntPtr CreateFileW(string name, uint access, uint share, IntPtr sa, uint disp, uint flags, IntPtr tmpl); [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);'
          # The [uint32] casts are load-bearing: PowerShell parses 0x80000000
          # as the SIGNED -2147483648 before any cast can run ([uint32]
          # hex-literal casts overflowed in runs 40437334177 AND 40438494245
          # - after the driver had already started; the probe, not the
          # product, failed). The decimal literal 2147483648 parses as a
          # POSITIVE int64 and casts cleanly: it IS GENERIC_READ.
          $INVALID = [IntPtr]::new(-1)
          $GENERIC_READ = [uint32]2147483648
          $h = [Win32.Native]::CreateFileW('\\.\RDA', $GENERIC_READ, [uint32]3, [IntPtr]::Zero, [uint32]3, [uint32]0, [IntPtr]::Zero)
          if ($h -eq $INVALID) {
            $info.rdaOpenGLE = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
            $info | ConvertTo-Json -Depth 4 | Set-Content t14-driver-info.json
            Write-Host ($info | ConvertTo-Json -Depth 4)
            Write-Error "\\.\RDA does not open (GLE $($info.rdaOpenGLE)) - the service is Running but the device is absent"
            exit 1
          }
          [Win32.Native]::CloseHandle($h) | Out-Null
          $info.rdaOpens = $true
          $info | ConvertTo-Json -Depth 4 | Set-Content t14-driver-info.json
          Write-Host ($info | ConvertTo-Json -Depth 4)

      - name: MSVC dev environment (cl for the harness build)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile + run the harness
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $kit = "build\out\stage-$version\engine"
          cl /nologo /std:c17 /O2 /W4 /DWIN32_LEAN_AND_MEAN `
             tools\validation\measure-cr-ui.c /I engine\include `
             /Fe:measure-cr-ui.exe /link "$kit\cr_ui.lib" psapi.lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The harness links cr_ui.dll statically — run it from the kit dir.
          Copy-Item measure-cr-ui.exe -Destination $kit
          Push-Location $kit
          # Streaming per-phase JSON lines: partial evidence survives a later
          # phase failure.
          .\measure-cr-ui.exe --quick-only > "$env:GITHUB_WORKSPACE\t14-engine.jsonl"
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { exit 1 }
          Get-Content "$env:GITHUB_WORKSPACE\t14-engine.jsonl" | Write-Host

      - name: Bridge-side measurements (G-7 filter cost + NodeMeta memory bound)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run the ignored T14 tests (release, serialized, uncaptured)
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $kit = Resolve-Path "build\out\stage-$version\engine"
          $env:CR_UI_LIB_DIR = "$kit"
          # The test binary statically imports cr_ui.dll: stage the kit's
          # DLLs beside it (deps\ is where cargo runs lib-test binaries).
          $tgt = "ui\src-tauri\target\release"
          New-Item -ItemType Directory -Force -Path "$tgt", "$tgt\deps" | Out-Null
          Copy-Item "$kit\*" -Destination "$tgt" -Force
          Copy-Item "$kit\*.dll" -Destination "$tgt\deps" -Force
          Push-Location ui\src-tauri
          cargo test --release -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object ..\..\t14-bridge.log
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { exit 1 }
          # Extract the JSON evidence lines (cargo captures stdout; the
          # T14JSON: prefix survives --nocapture).
          Select-String -Path t14-bridge.log -Pattern 'T14JSON:' |
            ForEach-Object { $_.Line -replace '^.*T14JSON: ', '' } | Set-Content t14-bridge.jsonl
          Get-Content t14-bridge.jsonl | Write-Host

      - name: Runner context (recorded with every measurement)
        shell: pwsh
        run: |
          @{
            imageOs     = $env:ImageOS
            runnerName  = $env:RUNNER_NAME
            cpu         = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty Name)
            cores       = (Get-CimInstance Win32_Processor | Select-Object -First 1 -ExpandProperty NumberOfLogicalProcessors)
            ramGb       = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
            ranAtUtc    = (Get-Date).ToUniversalTime().ToString('o')
            commit      = '${{ github.sha }}'
            runUrl      = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } | ConvertTo-Json | Set-Content runner-context.json

      - name: Upload T14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t14-measurements
          path: |
            t14-engine.jsonl
            t14-bridge.jsonl
            t14-bridge.log
            runner-context.json
          retention-days: 30
          if-no-files-found: error

  t15-installer-matrix:
    name: T15 installer runtime matrix (clean runner)
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: nuget/setup-nuget@v2

      - uses: microsoft/setup-msbuild@v2

      - name: Full product build (all lanes; tests are the CI lanes' job)
        shell: pwsh
        run: |
          $env:CR_UI_LIB_DIR = ''   # build.ps1 stages the kit and sets this itself
          ./build.ps1 -Target all -SkipTests
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run the runtime matrix (install / update / repair / uninstall)
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./tools/validation/installer-matrix.ps1 `
            -InstallerPath "build\out\RecoveryWizard-$version-setup.exe" `
            -OutDir t15-evidence
          # NOT $LASTEXITCODE: the matrix script is cmdlet-only (no native
          # command ever runs), so a fresh pwsh session leaves $LASTEXITCODE
          # $null — and $null -ne 0 is TRUE (the PowerShell null-comparison
          # asymmetry). Run 14 was the first fully-green matrix and this
          # check killed it AFTER 'all rows ok' printed, with no exception
          # output. $? is the script invocation's own success signal.
          if (-not $?) { exit 1 }

      - name: Upload the built installer (for the RC run + manual inspection)
        uses: actions/upload-artifact@v4
        with:
          name: t15-installer
          path: build/out/RecoveryWizard-*-setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload T15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t15-runtime-matrix
          path: t15-evidence/
          retention-days: 30
          if-no-files-found: error
