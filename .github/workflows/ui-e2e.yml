name: ui-e2e

# The Playwright lane: the fresh UI repository's smoke shape — the e2e
# suite (12 specs) runs against the built bundle served by `vite preview`.
# The build pins the mock connector (VITE_CONNECTOR=mock): the e2e specs
# are mock-pinned by design in this state; the real connector needs the
# Tauri shell + the engine kit, which is the release lane's business.
# Step screenshots are kept as visual evidence.
on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-e2e.yml'
  pull_request:
    paths:
      - 'ui/**'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend (mock connector, deterministic default seed)
        run: pnpm build
        env:
          VITE_CONNECTOR: mock

      - name: Run e2e suite (preview server)
        run: pnpm e2e
        env:
          CI: 'true'

      - name: Upload step screenshots (evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-step-screenshots
          path: ui/test-results/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-traces
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
