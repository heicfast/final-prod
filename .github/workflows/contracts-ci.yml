name: contracts-ci

# The boundary-truth gate: validate.mjs checks the error-code map against
# the engine header, the event map against CR_EVT_*, and — once the bridge
# lands (ui/src-tauri/src/bridge/abi.rs, P4) — phase 2 cross-checks the
# command manifest against BOTH implementations. Phase 2 is inert while
# the bridge is absent (prints 'pending', passes).
on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'engine/include/**'
      - 'ui/src/connector/**'
      - 'ui/src-tauri/src/**'
      - 'ui/scripts/gen-filefilter.mjs'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'engine/include/**'
      - 'ui/src/connector/**'
      - 'ui/src-tauri/src/**'
      - 'ui/scripts/gen-filefilter.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Boundary-truth validation (validate.mjs, phase 1 + 2)
        run: node contracts/validate.mjs

      - name: filefilter mirror freshness (engine table <-> bridge mirror)
        run: node ui/scripts/gen-filefilter.mjs --check
