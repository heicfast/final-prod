name: contracts-ci

# The boundary-truth gate: validate.mjs checks the error-code map against
# the engine header, the event map against CR_EVT_*, and — once the bridge
# lands (ui/src-tauri/src/bridge/abi.rs, P4) — phase 2 cross-checks the
# command manifest against BOTH implementations. Phase 2 is inert while
# the bridge is absent (prints 'pending', passes).
on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'engine/include/**'
      - 'ui/src/connector/**'
      - 'ui/src-tauri/src/**'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'engine/include/**'
      - 'ui/src/connector/**'
      - 'ui/src-tauri/src/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Boundary-truth validation (validate.mjs, phase 1 + 2)
        run: node contracts/validate.mjs
