name: driver-ci

# The driver lane (docs/INTEGRATION-PLAN.md §8.3), adopted from the driver
# repository's own proven CI (history: 840201ba / deletion 2a99173c) with
# working-directory adjusted to the driver/ sub-tree and paths filtered.
on:
  push:
    branches: [main]
    paths:
      - 'driver/**'
      - 'installer/devsign.ps1'
      - '.github/workflows/driver-ci.yml'
  pull_request:
    paths:
      - 'driver/**'
      - 'installer/devsign.ps1'

permissions:
  contents: read

defaults:
  run:
    working-directory: driver

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: clang-format check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format > /dev/null
          find src -name '*.c' -o -name '*.h' | tee /tmp/files.txt
          clang-format --version
          xargs -a /tmp/files.txt clang-format --dry-run --Werror

      - name: markdown sanity (trailing newlines)
        run: |
          set -e
          bad=0
          for f in $(find . -name '*.md' -not -path './.git/*'); do
            [ -f "$f" ] || continue
            tail -c1 "$f" | read -r _ || { echo "$f: missing trailing newline"; bad=1; }
          done
          exit $bad

      - name: unit tests (portable contract layer)
        run: |
          sudo apt-get install -y -qq gcc > /dev/null
          scripts/run-unit-tests.sh

  fuzz:
    name: fuzz (grammar + logic, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: libFuzzer round (open grammar, parser, token transform)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang > /dev/null
          export CC=clang
          make -C fuzz fuzz
          make -C fuzz run

      - name: invariant selftest (gcc fallback path, also run always)
        run: |
          make -C fuzz selftest

      - name: unit tests under ASan/UBSan
        run: |
          make -C fuzz unit

  unit:
    name: unit tests (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Locate MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build + run portable unit tests (MSVC /W4 /WX)
        shell: pwsh
        working-directory: driver
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          cl /nologo /W4 /WX /wd4127 /std:c11 /external:W0 `
             /I src\shared\inc `
             tests\unit\test_compat.c `
             /Fe:bin\test_compat.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\bin\test_compat.exe

  build:
    name: build ${{ matrix.configuration }} (wdk ${{ matrix.wdk }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022]
        wdk: [26100.6584]
        tag: [wdk26100]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore WDK/SDK packages (pinned)
        working-directory: driver
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        working-directory: driver
        run: |
          msbuild .\rda.sln `
            -m -v:minimal -nologo `
            -p:Configuration=${{ matrix.configuration }} `
            -p:Platform=x64

      - name: Stamp Win7 loader contract (OS 6.1, NATIVE 6.01)
        shell: pwsh
        working-directory: driver
        run: |
          $sys = "bin\x64\${{ matrix.configuration }}\rda.sys"
          python tools\stamp_osversion.py $sys

      - name: Win7 import/PE gate (verify_pe.py)
        shell: pwsh
        working-directory: driver
        run: |
          $sys = "bin\x64\${{ matrix.configuration }}\rda.sys"
          if (-not (Test-Path $sys)) { Write-Error "missing $sys"; exit 1 }
          python tools\verify_pe.py $sys

      - name: Verify unsigned artifact (no accidental build-time signing)
        shell: pwsh
        working-directory: driver
        run: |
          $sys = "bin\x64\${{ matrix.configuration }}\rda.sys"
          $bytes = [IO.File]::ReadAllBytes($sys)
          $lfanew = [BitConverter]::ToUInt32($bytes, 0x3C)
          $secDirRva = [BitConverter]::ToUInt32($bytes, $lfanew + 0x18 + 112 + 32)
          if ($secDirRva -ne 0) {
            Write-Error "binary carries a signature (SignMode must stay Off)"
            exit 1
          }
          Write-Host "artifact is unsigned as intended"


      # DEVELOPMENT TEST-SIGNING smoke leg (mandatory-driver session,
      # 2026-10-27): the product packaging signs rda.sys POST-build with the
      # ephemeral build certificate (installer/devsign.ps1). This leg proves
      # that tooling works on every driver-ci run: generate a certificate,
      # embed-sign a COPY of the just-built driver, verify the signer and
      # the PE security directory. The bare msbuild output above stays
      # unsigned - the signature is a PACKAGING step, never a build step.
      - name: Dev-sign smoke leg (the packaging-time signature)
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "devsign-smoke"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "driver\bin\x64\${{ matrix.configuration }}\rda.sys" -Destination (Join-Path $stage 'rda.sys') -Force
          $devsign = Join-Path $env:GITHUB_WORKSPACE 'installer\devsign.ps1'
          & $devsign -Action new-cert -StageDir $stage
          if (-not $?) { Write-Error "devsign new-cert failed"; exit 1 }
          & $devsign -Action sign -StageDir $stage -File (Join-Path $stage 'rda.sys')
          if (-not $?) { Write-Error "devsign sign failed"; exit 1 }
          & $devsign -Action verify -File (Join-Path $stage 'rda.sys')
          if (-not $?) { Write-Error "devsign verify failed"; exit 1 }
          # the PE security directory must be non-zero on the SIGNED copy
          $bytes = [IO.File]::ReadAllBytes((Join-Path $stage 'rda.sys'))
          $lfanew = [BitConverter]::ToUInt32($bytes, 0x3C)
          $secDirRva = [BitConverter]::ToUInt32($bytes, $lfanew + 0x18 + 112 + 32)
          if ($secDirRva -eq 0) {
            Write-Error "the signed copy carries no PE security directory"
            exit 1
          }
          Write-Host "dev-sign smoke leg: rda.sys development-signed + verified (packaging path proven)"
      - name: Upload driver + client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rda-${{ matrix.tag }}-${{ matrix.configuration }}
          path: |
            driver/bin/x64/${{ matrix.configuration }}/rda.sys
            driver/bin/x64/${{ matrix.configuration }}/rdacli.exe
            driver/src/driver/rda.inf
          if-no-files-found: error
