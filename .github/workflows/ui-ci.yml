name: ui-ci

# The UI lane: the fresh UI repository's own quality gates (its ci.yml
# posture), monorepo-adapted (working-directory ui/, lockfile cache path).
# cargo check / clippy need NO engine kit (no link step); the full tauri
# build with the engine kit is the release lane's business (build.ps1 /
# release.yml). The filefilter freshness gate returns with the P4 bridge
# (gen-filefilter.mjs mirror); the connector is the mock in this state.
on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'contracts/**'
      - '.github/workflows/ui-ci.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'contracts/**'

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Architecture rules (arch-lint A1-A7)
        run: pnpm arch:lint

      - name: Architecture rules (ast-grep)
        shell: bash
        run: |
          set -e
          # Rule 1: raw invoke() may only appear inside src/connector/**.
          # (Negation globs only — ast-grep ORs mixed globs, so a positive
          # glob would re-include the excluded tree.)
          npx ast-grep scan --rule rules/no-raw-invoke.yml --globs '!src/connector/**' src | tee /tmp/sg-invoke.out
          if grep -q "error\[" /tmp/sg-invoke.out; then exit 1; fi
          # Rule 2: the connector factory may only be imported by queries/ and connector/.
          npx ast-grep scan --rule rules/no-connector-import-outside-queries.yml --globs '!src/queries/**' --globs '!src/connector/**' src | tee /tmp/sg-import.out
          if grep -q "error\[" /tmp/sg-import.out; then exit 1; fi
          echo "ast-grep: clean"

      - name: filefilter mirror freshness
        run: pnpm filefilter:check

      - name: Dead code (knip)
        run: pnpm knip
        env:
          # oxc raw-transfer reserves a huge buffer per parsing core —
          # unnecessary on CI and fragile on memory-constrained runners
          # (the same knob this sandbox needs; documented in the UI repo's
          # original CI and carried forward).
          KNIP_DISABLE_RAW_TRANSFER: '1'

      - name: Duplication (jscpd)
        run: pnpm jscpd

      - name: Unit + component tests (coverage thresholds 70/60/70/70)
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Bundle budget
        run: pnpm bundle:check
        env:
          BUDGET_MAIN_KB: '200'
          BUDGET_TOTAL_KB: '500'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-16)
        with:
          toolchain: stable

      - name: Cargo check --tests (bridge + the T14 measurement modules; no link step)
        working-directory: ui/src-tauri
        run: cargo check --tests

      - name: Clippy (strict; the lib surface)
        working-directory: ui/src-tauri
        run: cargo clippy -- -D warnings

      - name: Upload web dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: ui/dist/
          retention-days: 7
