[package]
name = "recovery-wizard-ui"
version = "0.3.0"
description = "Recovery Wizard — user-facing recovery wizard (UI shell)"
edition = "2021"

[lib]
name = "recovery_wizard_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
