[package]
name = "recovery-wizard-ui"
version = "0.5.0-rc2"
description = "Recovery Wizard — user-facing recovery wizard (UI shell + cr_ui engine bridge)"
edition = "2021"

[lib]
name = "recovery_wizard_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Win32 surface for the bridge's own probes (disk usage, SCM/\\.\RDA driver
# status, destination validation). The engine transport itself lives in
# cr_ui.dll — these are the shell-side queries the ABI does not carry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Services",
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
