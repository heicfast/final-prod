[package]
name = "recovery-wizard-ui"
version = "0.9.2"
description = "Recovery Wizard — user-facing recovery wizard (UI shell + cr_ui engine bridge, ABI v4)"
edition = "2021"

[lib]
name = "recovery_wizard_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Win32 surface for the bridge's own probes (disk usage, the TokenElevation
# posture, the relaunch-as-admin verb). The engine transport itself lives in
# cr_ui.dll — these are the shell-side queries the ABI does not carry.
# NOTE: the driver era's Win32_System_Services (SCM) feature is GONE — the
# product is user-mode (no service exists to query).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
