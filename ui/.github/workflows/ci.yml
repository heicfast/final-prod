name: CI

on:
  push:
    branches: [v3]
  pull_request:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Architecture rules (arch-lint)
        run: pnpm arch:lint

      - name: Architecture rules (ast-grep)
        shell: bash
        run: |
          set -e
          # Rule 1: raw invoke() may only appear inside src/connector/**.
          # (Negation globs only — ast-grep ORs mixed globs, so a positive
          # glob would re-include the excluded tree.)
          npx ast-grep scan --rule rules/no-raw-invoke.yml --globs '!src/connector/**' src | tee /tmp/sg-invoke.out
          if grep -q "error\[" /tmp/sg-invoke.out; then exit 1; fi
          # Rule 2: the connector factory may only be imported by queries/ and connector/.
          npx ast-grep scan --rule rules/no-connector-import-outside-queries.yml --globs '!src/queries/**' --globs '!src/connector/**' src | tee /tmp/sg-import.out
          if grep -q "error\[" /tmp/sg-import.out; then exit 1; fi
          echo "ast-grep: clean"

      - name: Dead code (knip)
        run: pnpm knip
        env:
          # oxc raw-transfer reserves a 6 GiB buffer per parsing core —
          # unnecessary on CI and fragile on memory-constrained runners.
          KNIP_DISABLE_RAW_TRANSFER: '1'

      - name: Duplication (jscpd)
        run: pnpm jscpd

      - name: Unit + component tests (with coverage thresholds)
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Bundle budget
        run: pnpm bundle:check
        env:
          BUDGET_MAIN_KB: '200'
          BUDGET_TOTAL_KB: '500'

      - name: Rust check (shell)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
