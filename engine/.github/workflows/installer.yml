# installer.yml - the S-038 gate lane (PACKAGING.md section 11): the three
# red-blocking test gates for the app-installer milestone.
#
#   Gate 1 InstallerSilentRoundTrip  - clean install (/VERYSILENT, zero
#        prompts, driver component included) -> ARP UninstallString +
#        QuietUninstallString present and well-formed (the quiet form ends
#        " /SILENT") -> silent uninstall via the ARP QuietUninstallString
#        verbatim -> NO residue (files, ARP entry, version key, driver
#        service, driver image files).
#   Gate 2 InstallerVersionKeyWritten - the version key's write+verify path
#        (HKLM\SOFTWARE\heicfast\core_recovery\Version reads back exactly the
#        built version).
#   Gate 3 InstallerOSGateMatrix      - the OS gate admits the envelope and
#        REFUSES outside it (injectable version tuples + the ISS sync pin);
#        no install needed.
#
# The lane builds the installer from source (the CI charter: from-scratch
# validation is the point), fetches the prebuilt rda-driver release at the
# compatibility tier, test-signs it with a job-local cert (the proven runner
# mechanism - a production release consumes properly signed assets per
# docs/PACKAGING.md section 10 / DRIVER-RELEASE), and runs the round trip on
# the elevated runner.
#
# Inno Setup: the ISS requires 6.3+ (x64compatible); the windows-2022
# runner image ships 6.7.1 preinstalled - the lane detects it and only
# falls back to choco when absent (a pinned install would downgrade-fail,
# run 40682340640).
name: Installer gates (S-038)

on:
  push:
    branches: [main]
    paths: ['installer/**', 'tools/test_installer_osgate.py', '.github/workflows/installer.yml']
  pull_request:
    paths: ['installer/**', 'tools/test_installer_osgate.py', '.github/workflows/installer.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  osgate-matrix:
    # Gate 3 - fast, no build: the sync pin + the injectable version matrix
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Gate 3 - InstallerOSGateMatrix (sync pin + envelope matrix)
        shell: pwsh
        run: |
          python tools/test_installer_osgate.py
          if ($LASTEXITCODE) { exit 1 }
      - name: "PowerShell AST parse gate (the v0.2.3 lesson: a broken script broke every CI install)"
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in @('installer\osgate.ps1', 'installer\build-installer.ps1', 'installer\run-gates.ps1')) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$null, [ref]$errs)
            if ($errs.Count) {
              Write-Host "::error::${f}: $($errs[0].Extent.StartLineNumber): $($errs[0].Message)"
              $failed++
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'installer PS files parse clean'

  silent-roundtrip:
    # Gates 1+2 - the full round trip on a real elevated runner
    needs: [osgate-matrix]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Inno Setup 6.3+ (use the runner image's copy; choco fallback)"
        shell: pwsh
        run: |
          # the windows-2022 image ships Inno Setup 6.7.1 preinstalled; a
          # pinned choco install would try to DOWNGRADE and fail (run
          # 40682340640) - detect first, install only when absent (6.3+ is
          # the ISS's x64compatible floor; anything newer is fine)
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (Test-Path $iscc) {
            Write-Host "Inno Setup present: $iscc"
          } else {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: Configure + build (Release, manifest vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "vcpkg at: $env:VCPKG_ROOT"
          cmake --preset win-x64-release
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset win-x64-release
          if ($LASTEXITCODE) { exit 1 }

      - name: Win7 posture gate (stamp + import allowlist on the shipped binaries)
        shell: pwsh
        run: |
          python tools/stamp_osversion_um.py build\win-x64-release\src\app\Release\rrecov.exe
          if ($LASTEXITCODE) { exit 1 }
          python tools/stamp_osversion_um.py build\win-x64-release\src\ui\Release\cr_ui.dll
          if ($LASTEXITCODE) { exit 1 }
          python tools/verify_pe_um.py build\win-x64-release\src\app\Release\rrecov.exe --allowlist tools/ref_imports_um.json
          if ($LASTEXITCODE) { exit 1 }
          python tools/verify_pe_um.py build\win-x64-release\src\ui\Release\cr_ui.dll --allowlist tools/ref_imports_um.json
          if ($LASTEXITCODE) { exit 1 }

      - name: Fetch the prebuilt driver release (convention-enforced)
        shell: pwsh
        run: |
          & .github/scripts/fetch-release.ps1 -Repo heicfast/rda-driver -OutDir driver `
            -Required 'rda.sys,rda.inf,install.ps1,uninstall.ps1,SHA256SUMS' -FloorVersion v0.2.3
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test-sign the driver (job-local cert - the proven runner mechanism)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=RRECOV-CI" `
            -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(2) `
            -CertStoreLocation Cert:\LocalMachine\My
          $pw = ConvertTo-SecureString -String 'rrecov-ci' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath rda-ci.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath rda-ci.cer | Out-Null
          Import-Certificate -FilePath rda-ci.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath rda-ci.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f rda-ci.pfx /p rrecov-ci driver\rda.sys
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host 'driver test-signed (job-local cert)'

      - name: Build the installer
        shell: pwsh
        run: |
          $v = "1.0.0-gate.$env:GITHUB_RUN_NUMBER"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pwsh -File installer\build-installer.ps1 -Version $v
          if ($LASTEXITCODE) { exit 1 }

      - name: Gates 1+2 - InstallerSilentRoundTrip + InstallerVersionKeyWritten
        shell: pwsh
        run: |
          pwsh -File installer\run-gates.ps1 -SetupExe dist\core-recovery-setup.exe -Version $env:VERSION
          if ($LASTEXITCODE) { exit 1 }

      - name: Upload the installer artifact (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-recovery-setup-${{ github.run_number }}
          path: dist/core-recovery-setup.exe
          retention-days: 14
          if-no-files-found: ignore
