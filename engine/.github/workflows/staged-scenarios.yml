# staged-scenarios.yml - the TRUTH MATRIX (no build; consumes the latest
# prebuilt driver + core releases by the documented convention - docs/
# PREBUILT-ARTIFACTS.md, docs/CI-SCENARIOS.md).
#
# Structure: `setup` installs the driver (shared composite) + stages the
# core + records the env manifest (runner image, toolchain versions, the
# RESOLVED tags + hashes - downstream jobs re-fetch the SAME recorded tags,
# so a mid-run release cannot skew the matrix). Each scenario job then:
# stages a VHD seeded per the versioned manifest, runs the scripted
# deletion, scans with the prebuilt core through the real driver, compares
# found vs the staged ground truth, recovers to a fresh destination, and
# hash-verifies every recovered file. Evidence uploads = the acceptance
# proof per scenario. Real driver, real core, real disk - no mock.
name: Staged scenarios (prebuilt)

on:
  workflow_dispatch:
    inputs:
      driver_tag:
        description: 'explicit driver tag pin (empty = latest by convention)'
        default: ''
      core_tag:
        description: 'explicit core tag pin (empty = latest by convention)'
        default: ''
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

env:
  DRIVER_TAG_PIN: ${{ inputs.driver_tag }}
  CORE_TAG_PIN: ${{ inputs.core_tag }}

jobs:
  setup:
    runs-on: windows-2022
    outputs:
      driver_tag: ${{ steps.tags.outputs.driver }}
      core_tag: ${{ steps.tags.outputs.core }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve + verify BOTH prebuilt releases (convention-enforced, recorded)
        id: tags
        shell: pwsh
        run: |
          & .github/scripts/fetch-release.ps1 -Repo heicfast/rda-driver -OutDir driver `
            -Required rda.sys, rda.inf, install.ps1, uninstall.ps1, SHA256SUMS -FloorVersion v0.2.1 `
            $(if ($env:DRIVER_TAG_PIN) { @('-Tag', $env:DRIVER_TAG_PIN) })
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $hdr = @{ Authorization = "token ${{ secrets.GITHUB_TOKEN }}" }
          if ($env:CORE_TAG_PIN) {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/heicfast/core_recovery/releases/tags/$env:CORE_TAG_PIN" -Headers $hdr
          } else {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/heicfast/core_recovery/releases/latest" -Headers $hdr
          }
          $zip = ($rel.assets | Where-Object { $_.name -like 'core-recovery-*.zip' } | Select-Object -First 1).name
          & .github/scripts/fetch-release.ps1 -Repo heicfast/core_recovery -OutDir core `
            -Required @($zip, 'MANIFEST.json', 'SHA256SUMS') `
            $(if ($env:CORE_TAG_PIN) { @('-Tag', $env:CORE_TAG_PIN) })
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive "core\$zip" -DestinationPath core-staged -Force
          $d = (Get-Content driver\resolved-release.json -Raw | ConvertFrom-Json).tag
          "driver=$d" >> $env:GITHUB_OUTPUT
          "core=$($rel.tag_name)" >> $env:GITHUB_OUTPUT

      - name: Install the prebuilt driver (fetch + verify + test-sign + service)
        uses: ./.github/actions/install-driver
        with:
          service: rda
          driver_dir: driver
          tag: ${{ steps.tags.outputs.driver }}

      - name: Core-side driver verification (the new surface proves the install)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\core-staged\bin;$env:PATH"
          $out = & core-staged\bin\rrecov.exe driver --json 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::driver not Ready for the scenario matrix"; exit 1 }
          if (-not ($out -match '"state":"ready"')) { Write-Host "::error::driver state not ready"; exit 1 }
          exit 0   # explicit: the driver-verb probe exits 0 only when ready; the step needs its own verdict

      - name: Record the env manifest (runner, toolchain, resolved tags)
        shell: pwsh
        run: |
          $msvc = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name
          [ordered]@{
            runner_image = $env:ImageOS
            msvc = $msvc
            driver_tag = '${{ steps.tags.outputs.driver }}'
            core_tag = '${{ steps.tags.outputs.core }}'
            manifest_convention = 'docs/PREBUILT-ARTIFACTS.md'
          } | ConvertTo-Json | Set-Content env-manifest.json
          Get-Content env-manifest.json | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: scenario-setup
          path: |
            env-manifest.json
            driver\resolved-release.json
            core\resolved-release.json
          if-no-files-found: error

  scenario:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: S-DEL-NTFS
            fs: NTFS
            quick_format: false
          - id: S-DEL-FAT32
            fs: FAT32
            quick_format: false
          - id: S-DEL-EXFAT
            fs: exFAT
            quick_format: false
          - id: S-FMT-NTFS
            fs: NTFS
            quick_format: true
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Re-fetch the SAME recorded releases (tags pinned by setup)
        shell: pwsh
        run: |
          & .github/scripts/fetch-release.ps1 -Repo heicfast/rda-driver -OutDir driver `
            -Required rda.sys, rda.inf, install.ps1, uninstall.ps1, SHA256SUMS `
            -Tag '${{ needs.setup.outputs.driver_tag }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $hdr = @{ Authorization = "token ${{ secrets.GITHUB_TOKEN }}" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/heicfast/core_recovery/releases/tags/${{ needs.setup.outputs.core_tag }}" -Headers $hdr
          $zip = ($rel.assets | Where-Object { $_.name -like 'core-recovery-*.zip' } | Select-Object -First 1).name
          & .github/scripts/fetch-release.ps1 -Repo heicfast/core_recovery -OutDir core `
            -Required @($zip, 'MANIFEST.json', 'SHA256SUMS') -Tag '${{ needs.setup.outputs.core_tag }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive "core\$zip" -DestinationPath core-staged -Force

      - name: Install the driver (recorded tag)
        uses: ./.github/actions/install-driver
        with:
          service: rda
          driver_dir: driver
          tag: ${{ needs.setup.outputs.driver_tag }}

      - name: "Stage the disk (${{ matrix.fs }}$(if (${{ matrix.quick_format }}) {' + quick-format'})) + scripted deletion"
        shell: pwsh
        run: |
          $args = @('-VhdPath', "$PWD\disk.vhdx", '-SizeMB', '256', '-Fs', '${{ matrix.fs }}',
                    '-Manifest', '.github\scenarios\seed-manifest.json', '-OutDir', 'staging')
          if ('${{ matrix.quick_format }}' -eq 'true') { $args += '-QuickFormat' }
          & .github\scripts\stage-disk.ps1 @args
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content staging\staged-truth.json | Write-Host

      - name: Scan + verify + recover + hash-verify (the acceptance proof)
        shell: pwsh
        run: |
          & .github\scripts\verify-scenario.ps1 -Rrecov "$PWD\core-staged\bin\rrecov.exe" `
            -Staging staging -OutDir evidence
          $rc = $LASTEXITCODE
          Copy-Item staging\staged-truth.json evidence\ -Force
          exit $rc

      - name: Detach the VHD (always)
        if: always()
        shell: pwsh
        run: |
          $m = Get-VHD -Path "$PWD\disk.vhdx" -ErrorAction SilentlyContinue
          if ($m -and $m.Attached) { Dismount-VHD -Path "$PWD\disk.vhdx" }

      - name: Uninstall the driver (always)
        if: always()
        shell: pwsh
        run: |
          sc.exe stop rda 2>$null | Out-Null
          sc.exe delete rda 2>$null | Out-Null
          Remove-Item "$env:SystemRoot\System32\drivers\rda.sys" -Force -ErrorAction SilentlyContinue

      - name: Upload the evidence artifact (the acceptance proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.id }}-${{ github.run_id }}
          path: |
            evidence\
            staging\staged-truth.json
          if-no-files-found: error
