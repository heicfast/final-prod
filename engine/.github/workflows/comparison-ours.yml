name: Comparison - ours (rrecov leg on the shared seeded layout)

# OUR leg of the EaseUS head-to-head. The comparison was split into two
# independent workflows (this one + comparison-easeus.yml) so a UI-leg
# hiccup can never void a CLI-leg run and vice versa; both legs use the
# SAME methodology and environment:
#   - windows-2022 runner, 8 GiB fixed VHD, GPT, one 5 GB NTFS volume
#   - the SAME deterministic bench_seed.ps1 defaults (identical manifest
#     across runners by construction - fixed-seed System.Random)
#   - BOTH raw-disk drivers installed side by side (og eprdtdrv.sys and
#     our rda.sys under distinct service identities, non-fatal starts)
#   - capped poll-and-kill scan; identical scoring via compare_report.py
# The og workflow fetches this run's artifact (ours.csv) at its end and
# produces the combined report.

on:
  workflow_dispatch:
    inputs:
      scan_minutes:
        description: 'Hard cap for the recovery scan (minutes)'
        required: true
        default: '20'

permissions:
  contents: read

env:
  VHD_PATH: D:\rrecov-cmp-ours.vhdx
  RESEARCH_REPO: heicfast/easeus-drw-research

jobs:
  ours:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the research corpus (og-codebase, for the og driver)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RESEARCH_REPO }}
          path: research
          sparse-checkout: |
            og-codebase

      - name: Build rrecov (Release)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset win-x64-release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build --preset win-x64-release -j 2
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fetch our RDA driver (v0.2.0) + test-sign it
        shell: pwsh
        run: |
          $hdr = @{ Authorization = "token ${{ secrets.GITHUB_TOKEN }}" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/heicfast/rda-driver/releases/tags/v0.2.0" -Headers $hdr
          New-Item -ItemType Directory -Force -Path driver | Out-Null
          foreach ($asset in $rel.assets) {
            if ($asset.name -in @("rda.sys", "install.ps1")) {
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "driver\$($asset.name)" -Headers $hdr
            }
          }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=RRECOV-CMP-OURS" `
            -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(2) `
            -CertStoreLocation Cert:\LocalMachine\My
          $pwd2 = ConvertTo-SecureString -String "rrecov-cmp" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath rda-test.pfx -Password $pwd2 | Out-Null
          Export-Certificate -Cert $cert -FilePath rda-test.cer | Out-Null
          Import-Certificate -FilePath rda-test.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath rda-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f rda-test.pfx /p rrecov-cmp driver\rda.sys
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create + attach the seeded VHD (shared comparison layout)
        shell: pwsh
        run: |
          $dp = @"
          create vdisk file="$env:VHD_PATH" type=fixed maximum=8192
          attach vdisk
          "@
          $dp | Set-Content -Path disk.txt -Encoding ascii
          diskpart /s disk.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep -Seconds 3
          $disk = (Get-Disk | Sort-Object Number | Select-Object -Last 1).Number
          "DISK=$disk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Initialize-Disk -Number $disk -PartitionStyle GPT
          $p1 = New-Partition -DiskNumber $disk -Size 5GB -AssignDriveLetter
          $vol = Format-Volume -Partition $p1 -FileSystem NTFS -NewFileSystemLabel "CMP-NTFS"
          "NTFS_LETTER=$($vol.DriveLetter)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "comparison disk $disk, NTFS volume $($vol.DriveLetter):"

      - name: Seed ground truth (deterministic - identical to the og leg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path compare-results | Out-Null
          powershell -ExecutionPolicy Bypass -File scripts\bench_seed.ps1 `
            -Root "$($env:NTFS_LETTER):\seed" `
            -ManifestOut compare-results\manifest.csv
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install both drivers side by side (non-fatal starts)
        shell: pwsh
        run: |
          # og driver first (DigiCert chain - loads on runners, proven by
          # the rda-driver benchmark pipeline). Start failures are NON-FATAL
          # here: this leg only needs OUR driver; a signature-policy hiccup
          # must not void the run (log why, continue).
          $ogdrv = Get-ChildItem research\og-codebase -Recurse -Filter eprdtdrv.sys |
            Select-Object -First 1
          if ($ogdrv) {
            Copy-Item $ogdrv.FullName "$env:SystemRoot\System32\drivers\eprdtdrv.sys" -Force
            sc.exe create eprdtdrv type= kernel start= demand binPath= "System32\drivers\eprdtdrv.sys" group= "FSFilter Boot File System"
            sc.exe start eprdtdrv
            if ($LASTEXITCODE -ne 0) { Write-Host "og driver start failed (non-fatal)"; sc.exe query eprdtdrv }
          } else {
            Write-Host "eprdtdrv.sys not found in corpus (non-fatal)"
          }
          # our driver - REQUIRED for this leg
          Copy-Item driver\rda.sys "$env:SystemRoot\System32\drivers\rdatest.sys" -Force
          sc.exe create rdatest type= kernel start= demand binPath= "System32\drivers\rdatest.sys" group= "FSFilter Boot File System"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          sc.exe start rdatest
          if ($LASTEXITCODE -ne 0) {
            sc.exe query rdatest
            Get-WinEvent -LogName System -MaxEvents 20 | Format-List | Out-String | Write-Host
            exit 1
          }
          sc.exe query eprdtdrv; sc.exe query rdatest

      - name: Run our recovery scan (same volume the og UI selects, capped)
        shell: pwsh
        run: |
          $exe = "build\win-x64-release\src\app\Release\rrecov.exe"
          $cap = [int]'${{ inputs.scan_minutes }}' * 60
          $t0 = Get-Date
          $p = Start-Process -FilePath $exe -ArgumentList @(
              'scan', '--volume', "$($env:NTFS_LETTER)`:", '--deep', '--threads', '4',
              '--out', 'compare-results\ours-session.crsf',
              '--log', 'compare-results\rrecov.log', '--json'
            ) -RedirectStandardOutput 'compare-results\scan-ours.json' `
              -RedirectStandardError 'compare-results\scan-ours.err' -PassThru -NoNewWindow
          while (-not $p.HasExited -and ((Get-Date) - $t0).TotalSeconds -lt $cap) {
            Start-Sleep -Seconds 10
          }
          if (-not $p.HasExited) {
            Write-Host "scan exceeded the ${{ inputs.scan_minutes }}-minute cap - capturing partial state"
            "scan_capped=true" | Out-File compare-results\capped.txt -Encoding utf8
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          } else {
            "scan_capped=false" | Out-File compare-results\capped.txt -Encoding utf8
          }
          $dt = ((Get-Date) - $t0).TotalSeconds
          "rrecov_scan_seconds=$([math]::Round($dt,1))" | Out-File compare-results\timing-ours.txt -Encoding utf8
          if (-not (Test-Path compare-results\ours-session.crsf)) {
            Write-Host "scan produced NO session - hard fail (a leg with no results must be red, not silently green)"
            exit 1
          }
          & $exe tree --in compare-results\ours-session.crsf --csv `
            | Out-File -FilePath compare-results\ours.csv -Encoding utf8

      - name: Cleanup (always)
        if: always()
        shell: pwsh
        run: |
          sc.exe stop rdatest 2>$null; sc.exe delete rdatest 2>$null
          sc.exe stop eprdtdrv 2>$null; sc.exe delete eprdtdrv 2>$null
          Remove-Item "$env:SystemRoot\System32\drivers\rdatest.sys" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SystemRoot\System32\drivers\eprdtdrv.sys" -Force -ErrorAction SilentlyContinue
          $dp = "select vdisk file=`"$env:VHD_PATH`"`ndetach vdisk"
          $dp | Set-Content -Path disk-clean.txt -Encoding ascii
          diskpart /s disk-clean.txt 2>$null
          Remove-Item $env:VHD_PATH -Force -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\LocalMachine\My |
            Where-Object { $_.Subject -eq "CN=RRECOV-CMP-OURS" } |
            Remove-Item -ErrorAction SilentlyContinue

      - name: Upload comparison artifacts (ours leg)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-ours
          path: compare-results/
          retention-days: 60
