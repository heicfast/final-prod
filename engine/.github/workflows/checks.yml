# checks.yml - the post-commit validation lane (the pre-merge gate).
#
# THE WINDOWS-ONLY CONSOLIDATION (docs/CI-CURRENT.md): this lane replaces
# the old ci.yml 7-job set. The ubuntu sanitizer/fuzz lanes were dropped by
# the owner's windows-only directive - a documented decision, not an
# accident: the pure core keeps its sanitizer coverage locally via
# `./ci-local.sh --san|--fuzz` on dev machines, and MSVC /W4 /WX is the
# global compile gate here (docs/BUILD-SUPPRESSIONS.md: zero suppressions).
#
# Component map (mirrors ci-local.ps1, the developer entry point - the
# numbering is that script's own):
#   [1] clang-format --dry-run -Werror over src/ include/ tests/
#   [2] N-041 dead-surface lint + the direct-access architecture lints
#   [3] MSVC /W4 /WX Release build (win-x64-release preset, vcpkg manifest)
#   [4] full ctest (all GoogleTest suites + the cr_ui ABI check)
#   [5] Win7 posture gate (stamp_osversion_um.py + verify_pe_um.py)
#   [6] vcpkg.json manifest presence (the pinning policy)
#   [7] G-09 report-schema validation + the elevation refusal-contract
#       probes (the unelevated-token probe: rrecov scan must exit 4 with
#       the ERR_ELEVATION_REQUIRED refusal when the process token is not
#       elevated - proven through a LIMITED-run scheduled task, the
#       UAC-filtered token; and the elevated-path probe: bench --mode
#       info passes the gate - the standing regression probe this lane
#       owns)
# Plus two CI-owned gates the local gate does not need:
#   - the PowerShell AST parse gate over every CI-consumed script (the
#     S-036 lesson: a PS 5.1 parse-time crash in install.ps1 broke every
#     install for an era)
#   - the workflow YAML parse gate (the stray-brace class that killed the
#     old benchmark.yml across 5 dispatches)
#
# Efficiency contract: vcpkg binary caching keyed on vcpkg.json (the old
# lane rebuilt zlib/gtest/lz4/zstd from source on EVERY run - the single
# largest fixed cost), paths-ignore on docs-only pushes for BOTH push and
# PR (symmetric - the old lane lacked the PR filter), concurrency
# cancel-in-progress on new pushes, and lint fast-fails BEFORE the heavy
# build job starts (the lint gate is historically the most frequently red
# lane - no point burning 90 minutes of build compute behind it).
#
# windows-2022 is pinned everywhere (not windows-latest): it is the
# execution-validated runner class for this tree (VS2022 Enterprise
# layout, VCPKG_INSTALLATION_ROOT; docs/PREBUILT-ARTIFACTS.md section 2).
name: Checks

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'worklog.md', 'worklog/**', 'AUDIT*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'worklog.md', 'worklog/**', 'AUDIT*.md']
  workflow_call: {} # release.yml calls this lane as its validation gate
  # Added 2026-10-30 (the coherence lane): paths-ignore means a docs-only
  # fix push triggers nothing - which left main's last run red after the
  # fix had already landed (the 41026660604 class). The dispatch trigger
  # lets any lane re-prove the gate on the CURRENT head without an
  # artificial file touch; no job, step, or gate changes.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # EVENT-SCOPED (the run-40688552776 lesson): a push-triggered run and a
  # release's nested workflow_call validate MUST NOT share a group - a
  # shared group let any mid-release push cancel the release's own
  # validation. Push storms still cancel each other (the compute-saving
  # behavior); the release's validate runs in its own workflow_call group
  # and nothing else joins it (release.yml's own no-cancel concurrency
  # serializes releases themselves).
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + parse gates
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: pip cache (clang-format wheel)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-clangformat-win2022
          restore-keys: pip-clangformat-win2022

      # ci-local.ps1 component [1]. clang-format is PINNED to 18.1.8 - the
      # version the active lanes' containers and the last-green CI era used
      # (the unpinned 'latest' policy died on the drift: 23.x disagrees
      # with 18-formatted code, run 40692407577). The pin and the tree move
      # TOGETHER: bumping the pin is one commit that re-formats the tree
      # with the new version and updates ci-local.ps1 in the same change
      # (the local gate mirrors CI or developers stay red).
      - name: '[1/2] clang-format check (src/ include/ tests/)'
        shell: pwsh
        run: |
          pip install --quiet --disable-pip-version-check clang-format==18.1.8
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::pip install clang-format failed'; exit 1 }
          $files = Get-ChildItem -Recurse -Include *.h,*.hpp,*.cpp,*.c -Path src,include,tests | ForEach-Object FullName
          if (-not $files -or $files.Count -eq 0) { Write-Host '::error::no sources found to format-check'; exit 1 }
          $bad = $files | ForEach-Object { & clang-format --dry-run -Werror $_ 2>&1 } |
            Select-String 'error:' | Select-Object -First 20
          if ($bad) {
            $bad | ForEach-Object { Write-Host "  $_" }
            Write-Host '::error::files need formatting - fix: clang-format -i (all files under src/ include/ tests/)'
            exit 1
          }
          Write-Host "clang-format clean ($($files.Count) files)"

      # ci-local.ps1 component [2], verbatim patterns.
      - name: '[2/2] dead-surface + direct-access architecture lints'
        shell: pwsh
        run: |
          $failed = $false
          $n41 = Get-ChildItem -Recurse -Include *.cpp,*.h,*.c -Path src,include,tests,tools,bench,fuzz -ErrorAction SilentlyContinue |
            Select-String -Pattern 'RdaClient::','class RdaClient','volume_letter_to_disk' | Select-Object -First 5
          if ($n41) { Write-Host '::error::deleted dead-surface symbols found (N-041)'; $n41 | ForEach-Object { Write-Host "  $_" }; $failed = $true }
          else { Write-Host 'N-041 dead-surface lint clean' }

          $drv = Get-ChildItem -Recurse -Include *.cpp,*.h,*.c -Path src,include -ErrorAction SilentlyContinue |
            Select-String -Pattern 'rda_available\s*\(','win_pe_environment\s*\(','open_harddisk_volume\s*\(','prefer_rda' |
            Where-Object { $_.Line -notmatch '^\s*(/\*|\*|//)' } | Select-Object -First 5
          if ($drv) { Write-Host '::error::removed fallback primitives in production code (direct-access architecture)'; $drv | ForEach-Object { Write-Host "  $_" }; $failed = $true }
          else { Write-Host 'removed-primitive lint clean' }

          # session-96: the driver-era surface must never return (the driver
          # is REMOVED, not gated, not left as a fallback)
          $era = Get-ChildItem -Recurse -Include *.cpp,*.h,*.c -Path src,include -ErrorAction SilentlyContinue |
            Select-String -Pattern 'open_rda_partition','open_rda_volume','query_driver_status','RdaTargetDevice','compute_pid_token','kDefaultDriverService','cr_ui_driver_status','ERR_DRIVER_' |
            Select-Object -First 5
          if ($era) { Write-Host '::error::driver-era surface found in production code (the driver is REMOVED - session-96)'; $era | ForEach-Object { Write-Host "  $_" }; $failed = $true }
          else { Write-Host 'direct-access architecture lint clean (no driver-era surface)' }

          if (-not (Test-Path vcpkg.json)) { Write-Host '::error::vcpkg.json manifest missing (component 6)'; $failed = $true }
          else { Write-Host 'vcpkg.json manifest present (manifest mode = the pinning policy)' }

          if ($failed) { exit 1 }

      - name: 'PowerShell AST parse gate (every CI-consumed script)'
        shell: pwsh
        run: |
          # The S-036 lesson: install.ps1's PS 5.1 parse-time crash broke
          # every CI install for an era behind a fallback. Every script any
          # workflow dispatches (ours or a release's) is parse-checked here
          # BEFORE a runner ever executes it.
          $ErrorActionPreference = 'Stop'
          $roots = @('ci-local.ps1')
          $roots += @(Get-ChildItem .github/scripts -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $roots += @(Get-ChildItem bench -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName)
          if ($roots.Count -le 1) { Write-Host '::error::no .github/scripts or bench ps1 found - tree shape changed?'; exit 1 }
          $failed = $false
          foreach ($s in $roots) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($s, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              Write-Host "::error::PARSE ERROR in ${s}:"
              $errs | Select-Object -First 5 | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "AST parse gate clean ($($roots.Count) scripts)"

      - name: 'Workflow YAML parse gate'
        shell: pwsh
        run: |
          # The stray-brace class killed the old benchmark.yml across 5
          # dispatches before anyone noticed. YAML-parse every workflow
          # here (python + PyYAML - the runner python has pip access).
          #
          # Extended 2026-10-30 (run 41024085633, the 53eb9fff class):
          # every inline pwsh/powershell run: block is now ALSO
          # extracted to disk and AST-parsed below - the M-071 step
          # shipped six "$LASTEXITCODE:" parse errors that passed every
          # gate, because the AST gate only ever saw .ps1 FILES while
          # the broken script lived inline in the YAML. The S-036
          # doctrine applied to its own last blind spot: no script any
          # workflow dispatches - file or inline - reaches a runner
          # unparsed.
          pip install --quiet --disable-pip-version-check pyyaml
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::pip install pyyaml failed'; exit 1 }
          $yamls = Get-ChildItem .github/workflows -Filter *.yml | ForEach-Object FullName
          if ($yamls.Count -lt 1) { Write-Host '::error::no workflows found'; exit 1 }
          $list = ($yamls -join '";"')
          python -c "import sys, yaml; [yaml.safe_load(open(p, encoding='utf-8')) for p in sys.argv[1:]]; print('YAML parse gate clean:', len(sys.argv)-1, 'workflow(s)')" $yamls
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # extract every inline pwsh/powershell run: block for the AST
          # pass (numbered by workflow + job + step name; the content is
          # written verbatim - what pwsh -command would have parsed)
          $blocks = Join-Path $env:RUNNER_TEMP 'wf-run-blocks'
          New-Item -ItemType Directory -Force -Path $blocks | Out-Null
          Remove-Item (Join-Path $blocks '*.ps1') -ErrorAction SilentlyContinue
          python -c "
          import os, re, sys, yaml
          blocks = sys.argv[1]
          n = 0
          for wf in sys.argv[2:]:
              doc = yaml.safe_load(open(wf, encoding='utf-8'))
              for jname, job in (doc.get('jobs') or {}).items():
                  steps = job.get('steps') or []
                  if 'uses' in job:  # reusable-workflow call: no steps
                      continue
                  for step in steps:
                      run = step.get('run')
                      shell = step.get('shell') or ''
                      if run and ('pwsh' in shell or 'powershell' in shell):
                          n += 1
                          stem = re.sub(r'[^A-Za-z0-9_.-]+', '_',
                              '%s-%s' % (jname, str(step.get('name', 'step'))[:40]))[:100]
                          with open(os.path.join(blocks, '%03d-%s.ps1' % (n, stem)),
                                    'w', encoding='utf-8') as f:
                              f.write(run)
          print('extracted', n, 'inline pwsh run block(s) for the AST gate')
          " $blocks $yamls
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::run-block extraction failed'; exit 1 }

          $inline = @(Get-ChildItem $blocks -Filter *.ps1)
          if ($inline.Count -lt 1) { Write-Host '::error::no inline pwsh run blocks extracted - extraction regression'; exit 1 }
          $failed = $false
          foreach ($s in $inline) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              Write-Host "::error::PARSE ERROR in inline block $($s.Name):"
              $errs | Select-Object -First 5 | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "inline run-block AST gate clean ($($inline.Count) block(s))"

      - name: 'CI-shape doc-truth gate (M-088)'
        shell: pwsh
        run: |
          # The consolidation's own drift prevention: (1) every live
          # -FloorVersion pin is one set at one floor (the installer lane
          # shipped at v0.2.3 for an era because nothing compared the
          # pins); (2) deleted CI surfaces (the composite action, the
          # three deleted workflows, api-benchmark) are cited only with a
          # historical marker - never as a current mechanism.
          python tools/doc_truth_gate.py
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::doc-truth gate failed (FloorVersion discipline or stale-lane citations)'; exit 1 }

  build-and-test:
    name: Build + test (MSVC Release, vcpkg cache)
    needs: lint
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Long paths: the test tree and any generated fixture can exceed
      # MAX_PATH; git must be allowed to see them (a classic silent-CI-red
      # source on Windows runners).
      - name: Enable git long paths
        shell: pwsh
        run: git config --system core.longpaths true

      # THE efficiency change: binary caching for the vcpkg manifest. The
      # old lane rebuilt zlib + gtest + lz4 + zstd from source on every
      # run (docs/CI-CURRENT.md "zero caching" was the known fixed cost).
      # VCPKG_DEFAULT_BINARY_CACHE points the toolchain's binary cache at
      # this directory; the key is the manifest hash so any dependency
      # change invalidates precisely.
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-bin-win2022-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bin-win2022-

      # ci-local.ps1 components [3]+[4]: the one Release build (the old
      # double Debug+Release build was deliberately cut) + full ctest.
      - name: Configure + build (win-x64-release, /W4 /WX)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          if (-not $env:VCPKG_ROOT) { Write-Host '::error::VCPKG_INSTALLATION_ROOT not set on the runner image'; exit 1 }
          $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          Write-Host "binary cache: $env:VCPKG_DEFAULT_BINARY_CACHE"
          cmake --preset win-x64-release
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::configure failed (win-x64-release preset)'; exit 1 }
          cmake --build --preset win-x64-release
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::build failed (MSVC /W4 /WX - the errors above are the fix list)'; exit 1 }
          Write-Host 'win-x64-release build clean'

      - name: Unit + contract tests (full ctest incl. cr_ui ABI)
        shell: pwsh
        run: |
          ctest --preset win-x64-release -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::ctest red (failures above)'; exit 1 }
          Write-Host 'ctest green'

      # ci-local.ps1 component [5]: stamp BEFORE verify (the ordering is
      # the contract - verify_pe_um.py fails on (10,0) OS fields).
      - name: Win7 posture gate (stamp + import allowlist)
        shell: pwsh
        run: |
          $pes = @(
            'build\win-x64-release\src\app\Release\rrecov.exe',
            'build\win-x64-release\tests\Release\cr_tests.exe',
            'build\win-x64-release\src\ui\Release\cr_ui.dll'
          )
          foreach ($pe in $pes) {
            if (-not (Test-Path $pe)) { Write-Host "::error::missing build artifact: $pe"; exit 1 }
            python tools/stamp_osversion_um.py $pe
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::stamp failed: $pe"; exit 1 }
            python tools/verify_pe_um.py $pe --allowlist tools/ref_imports_um.json
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::import allowlist failed: $pe"; exit 1 }
          }
          Write-Host 'Win7 posture gate clean (3 PE)'

      # G-09: test_report.cpp writes cr_report_sample.json into the system
      # temp dir during ctest; validate it AFTER ctest ran (ordering
      # dependency, ci-local.md documents the same step).
      - name: Recovery-report schema validation (G-09)
        shell: pwsh
        run: |
          $sample = Join-Path $env:TEMP 'cr_report_sample.json'
          if (-not (Test-Path $sample)) {
            Write-Host '::error::cr_report_sample.json not found in TEMP - the Report.EmitsCiSchemaSample test did not run (or moved its output)'
            exit 1
          }
          python tools/validate_report.py $sample
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::report schema validation failed'; exit 1 }
          Write-Host 'G-09 report schema valid'

      # The elevation refusal-contract probes (session-96: the driver
      # replacement - this lane's owned regression). The runner is
      # elevated by construction, so the REFUSAL path is proven through
      # a LIMITED-run scheduled task (the UAC-filtered token: the exact
      # non-elevated state a desktop user's launched process runs under).
      # Every probe that asserts a NON-ZERO exit by design ends with
      # this script's own explicit verdict - the exit-0-verdict lesson
      # (three dispatches died to it historically).
      - name: Elevation refusal-contract probes (exit-4 taxonomy)
        shell: pwsh
        run: |
          $rrecov = (Resolve-Path 'build\win-x64-release\src\app\Release\rrecov.exe').Path
          if (-not (Test-Path $rrecov)) { Write-Host "::error::missing $rrecov"; exit 1 }
          $failed = $false

          # usage: bare invocation prints usage, exit 0
          & $rrecov 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host 'PASS usage: exit 0' } else { Write-Host "::error::usage exited $LASTEXITCODE (expected 0)"; $failed = $true }

          # list: enumeration is classification (b) - file/registry work only, exit 0
          & $rrecov list 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host 'PASS list: exit 0' } else { Write-Host "::error::list exited $LASTEXITCODE (expected 0)"; $failed = $true }

          # list-carve-formats: registry enumeration, exit 0
          $carveOut = & $rrecov list-carve-formats 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Host 'PASS list-carve-formats: exit 0' } else { Write-Host "::error::list-carve-formats exited $LASTEXITCODE (expected 0)"; $failed = $true }

          # the UNELEVATED probe (Probe-Unelevated.ps1): the LUA-token
          # primitive drops the elevation from a duplicate of our own
          # token (the shell's own mechanism for unelevated children);
          # TokenElevation FALSE is exactly what is_elevated() probes.
          $probeOut = Join-Path $env:RUNNER_TEMP 'cr-unelevated-probe.txt'
          & pwsh -NoProfile -File .github\scripts\Probe-Unelevated.ps1 -RrecovExe $rrecov -OutFile $probeOut
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          # the ELEVATED probe: this shell's own token passes the gate -
          # bench --mode info opens disk 0's geometry (exit 0; the gate
          # passing is the assertion, not the geometry itself)
          & $rrecov bench --disk 0 --mode info 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host 'PASS elevated bench --mode info: the gate passed (exit 0)' } else { Write-Host "::error::elevated bench --mode info exited $LASTEXITCODE (expected 0 - the elevated runner must pass the gate)"; $failed = $true }

          if ($failed) { exit 1 }
          Write-Host 'driverless refusal contract: all probes green'
          # the exit-0-verdict lesson, applied to this very step: the last
          # NATIVE command above exits 4 BY DESIGN (the refusal probe), and
          # the runner's pwsh shim propagates $LASTEXITCODE when the script
          # does not exit explicitly - this run's own first dispatch died
          # exactly there (run 40684826829: every probe PASS, step red)
          exit 0

      # M-071: the CLI junk-gate contract. The FilterFolder hidden set
      # (FilterFolder.ini - desktop.ini, $UsnJrnl, System Volume
      # Information, the localized New Folder family) must never print
      # in the CLI tree and never be written by recover-all. The fixture
      # (tests/data/images/junk-gate-fat16.raw, generated by
      # tools/gen_junk_gate_fixture.py) is proven parseable/flagged by
      # the Linux-suite FilterFolder.JunkGateFixtureFile* tests; THIS
      # step is the only place the two rrecov.cpp gates themselves are
      # executed (the app layer is Windows-only). Driverless: --image
      # targets are classification (b).
      - name: CLI junk-filter contract (M-071 - tree + recover-all)
        shell: pwsh
        run: |
          $rrecov = 'build\win-x64-release\src\app\Release\rrecov.exe'
          if (-not (Test-Path $rrecov)) { Write-Host "::error::missing $rrecov"; exit 1 }
          $fixture = 'tests\data\images\junk-gate-fat16.raw'
          if (-not (Test-Path $fixture)) { Write-Host "::error::missing fixture $fixture (tools/gen_junk_gate_fixture.py)"; exit 1 }
          $work = Join-Path $env:TEMP "m071-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $work | Out-Null
          $session = Join-Path $work 'junk-gate.crsf'
          $dest = Join-Path $work 'recovered'
          $failed = $false

          # 1. scan the fixture (driverless --image target); the scan
          #    prints the result tree on completion.
          $scanOut = & $rrecov scan --image $fixture --out $session 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::scan --image exited ${LASTEXITCODE}: $scanOut"; exit 1 }

          # 2. the junk set never prints; the controls do. ASCII names
          #    only (encoding-stable assertions); the deleted file
          #    renders 0xE5 as #ELFILE.TXT (N-172: the og's placeholder
          #    is '#', FATSearchDLL FUN_180036350 :44166-44172 - the
          #    0xE5 first byte renders as 0x23; pinned on Linux by
          #    test_orchestrator.cpp's junk-gate suite).
          foreach ($junk in @('DESKTOP.INI','$USNJRNL','System Volume Information','TRACKER.TXT')) {
            if ($scanOut -match [regex]::Escape($junk)) {
              Write-Host "::error::junk name '$junk' leaked into the scan tree output (M-071 gate missing)"; $failed = $true
            }
          }
          foreach ($good in @('DOC.TXT','KEEP.ME','#ELFILE.TXT')) {
            if ($scanOut -notmatch [regex]::Escape($good)) {
              Write-Host "::error::control '$good' missing from the scan tree output"; $failed = $true
            }
          }

          # 3. the tree verb re-loads the session: the flags must
          #    round-trip through the crsf container.
          $treeOut = & $rrecov tree --in $session 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::tree --in exited ${LASTEXITCODE}: $treeOut"; exit 1 }
          foreach ($junk in @('DESKTOP.INI','$USNJRNL','System Volume Information','TRACKER.TXT')) {
            if ($treeOut -match [regex]::Escape($junk)) {
              Write-Host "::error::junk name '$junk' leaked into the session tree output (flag round-trip or M-071 gate missing)"; $failed = $true
            }
          }
          foreach ($good in @('DOC.TXT','KEEP.ME','#ELFILE.TXT')) {
            if ($treeOut -notmatch [regex]::Escape($good)) {
              Write-Host "::error::control '$good' missing from the session tree output"; $failed = $true
            }
          }

          # 3b. A-013: the resume-without-out round-trip - the exact
          #     command shape the save-on-cancel flow prints. Pre-fix,
          #     this command truncated the session to 0 bytes BEFORE
          #     reading it (total loss of the only copy); post-fix the
          #     sink stages into <path>.tmp and commits by rename, so
          #     the resume reads the intact source and rewrites it only
          #     on a successful checkpoint/final save.
          $preSize = (Get-Item $session).Length
          if ($preSize -le 0) { Write-Host "::error::session file is empty before resume"; exit 1 }
          $resOut = & $rrecov scan --image $fixture --resume $session 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::resume-without-out exited $LASTEXITCODE (A-013: the session was destroyed or the resume broke): $resOut"; exit 1 }
          $postSize = (Get-Item $session).Length
          if ($postSize -le 0) { Write-Host "::error::A-013 regression: the resume command left a 0-byte session"; exit 1 }
          $treeOut2 = & $rrecov tree --in $session 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::post-resume tree --in exited ${LASTEXITCODE}: $treeOut2"; exit 1 }
          if ($treeOut2 -notmatch [regex]::Escape('DOC.TXT')) {
            Write-Host "::error::A-013 regression: the resumed session lost its tree"; exit 1
          }

          # 4. recover-all over the session: junk never written, the
          #    controls (incl. the deleted file) are.
          $recOut = & $rrecov recover --in $session --image $fixture --to $dest 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::recover exited ${LASTEXITCODE}: $recOut"; exit 1 }
          $written = Get-ChildItem -Path $dest -Recurse -File | ForEach-Object { $_.Name }
          foreach ($junk in @('DESKTOP.INI','$USNJRNL','TRACKER.TXT')) {
            if ($written -contains $junk) {
              Write-Host "::error::recover-all WROTE the junk file '$junk' (M-071 gate missing)"; $failed = $true
            }
          }
          if ($written -notcontains 'DOC.TXT') { Write-Host '::error::recover-all did not write DOC.TXT'; $failed = $true }
          if ($written -notcontains 'KEEP.ME') { Write-Host '::error::recover-all did not write KEEP.ME'; $failed = $true }
          if ($written -notcontains '#ELFILE.TXT') { Write-Host '::error::recover-all did not write the deleted #ELFILE.TXT (N-172: the og placeholder renders 0xE5 as #)'; $failed = $true }

          # 5. M-079: the auto-save <vol> half - the scan derives the
          #    fixture's BPB label (JUNKGATE) into the auto-save name;
          #    --label overrides it with caller text.
          $auto1 = Join-Path $work 'auto1'
          New-Item -ItemType Directory -Path $auto1 | Out-Null
          $scanOut2 = & $rrecov scan --image $fixture --autosave-dir $auto1 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::scan --autosave-dir exited ${LASTEXITCODE}: $scanOut2"; exit 1 }
          $autoFiles = @(Get-ChildItem -Path $auto1 -Filter '*.crsf' -File)
          if ($autoFiles.Count -ne 1) { Write-Host "::error::expected exactly one auto session, got $($autoFiles.Count)"; $failed = $true }
          else {
            # N-133's corrected precedence (the assertion corrected
            # 2026-10-30, run 41029969175's first-ever execution):
            # --label > the ENGINE-decoded on-disk label > the image-stem
            # fallback - "the og's session carries the engine label, not
            # the filename stem" (rrecov.cpp:2032-2035). The fixture's
            # BPB label is JUNKGATE, so the auto name is
            # auto_JUNKGATE<stamp>; the stem (fill_volume_label, 0b76757)
            # is the fallback for label-less volumes only. The mangle
            # auto_JUNKGATEe-fat16 was the unterminated-copy bug fixed
            # the same day (rrecov.cpp:2036 + cr_scan.cpp:2126).
            if ($autoFiles[0].Name -notmatch '^auto_JUNKGATE[0-9]{2}_') { Write-Host "::error::the auto-save name does not carry the engine-decoded volume label (N-133 precedence): $($autoFiles[0].Name)"; $failed = $true }
          }
          $auto2 = Join-Path $work 'auto2'
          New-Item -ItemType Directory -Path $auto2 | Out-Null
          $scanOut3 = & $rrecov scan --image $fixture --autosave-dir $auto2 --label CUSTOM 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::scan --label exited ${LASTEXITCODE}: $scanOut3"; exit 1 }
          $autoFiles2 = @(Get-ChildItem -Path $auto2 -Filter '*.crsf' -File)
          if ($autoFiles2.Count -ne 1) { Write-Host "::error::expected exactly one auto session (--label), got $($autoFiles2.Count)"; $failed = $true }
          else {
            if ($autoFiles2[0].Name -notmatch '^auto_CUSTOM[0-9]{2}_') { Write-Host "::error::the --label override did not win: $($autoFiles2[0].Name)"; $failed = $true }
          }

          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          if ($failed) { exit 1 }
          Write-Host 'M-071 CLI junk-gate contract green (tree + session round-trip + recover-all + M-079 label naming)'
          exit 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-failure-diagnostics-${{ github.run_id }}
          path: |
            build/win-x64-release/CMakeCache.txt
            build/win-x64-release/Testing/**/*.log
          if-no-files-found: ignore
          retention-days: 7
