# driver-install.yml - the prebuilt DRIVER lane (no build; the S-DRV-REFUSE
# refusal proof rides here too). docs/PREBUILT-ARTIFACTS.md is the convention;
# docs/CI-SCENARIOS.md row S-DRV-REFUSE is the behavioral contract proven.
#
# Phases (all on windows-2022, real service control, real driver - no mock):
#   1. ABSENT     - driver NOT installed: `rrecov driver` exits 4 with the
#                   ERR_DRIVER_ABSENT class; `rrecov scan --disk` refuses on
#                   stderr with exit 4 and NO scan output (the whole response).
#   2. READY      - install via the shared composite (fetch latest release by
#                   convention + SHA256SUMS verify + test-sign + install.ps1 +
#                   sc start): `rrecov driver --json` exits 0 with state ready
#                   and every facet green; a staged-disk scan PROCEEDS.
#   3. NOT_STARTED- `sc stop`: `rrecov driver` exits 4 with the
#                   ERR_DRIVER_NOT_STARTED class.
# Evidence: driver-status JSON per phase + captured stdout/stderr + exit codes
# + the resolved release tags + the env manifest (runner image, toolchain).
# Uninstall ALWAYS runs (leave the runner clean).
name: Driver install + refusal contract (prebuilt)

on:
  workflow_dispatch:
    inputs:
      driver_tag:
        description: 'explicit driver tag pin (empty = latest by convention)'
        default: ''
      core_tag:
        description: 'explicit core tag pin (empty = latest by convention)'
        default: ''
  schedule:
    - cron: '0 5 * * *' # daily drift watch on the latest prebuilt pair

permissions:
  contents: read

jobs:
  driver-refusal-and-install:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ---- phase 1: ABSENT (the refusal contract, pinned before install) ----
      - name: Fetch the latest prebuilt CORE release (convention-enforced)
        shell: pwsh
        run: |
          # the zip name carries the resolved tag - fetch metadata first
          $hdr = @{ Authorization = "token ${{ secrets.GITHUB_TOKEN }}" }
          if ('${{ inputs.core_tag }}') {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/heicfast/core_recovery/releases/tags/${{ inputs.core_tag }}" -Headers $hdr
          } else {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/heicfast/core_recovery/releases/latest" -Headers $hdr
          }
          $zip = ($rel.assets | Where-Object { $_.name -like 'core-recovery-*.zip' } | Select-Object -First 1).name
          if (-not $zip) { Write-Host "::error::no core-recovery zip in $($rel.tag_name)"; exit 1 }
          & .github/scripts/fetch-release.ps1 -Repo heicfast/core_recovery -OutDir core `
            -Required @($zip, 'MANIFEST.json', 'SHA256SUMS', 'rda.sys', 'rda.inf', 'install.ps1', 'uninstall.ps1') `
            $(if ('${{ inputs.core_tag }}') { @('-Tag', '${{ inputs.core_tag }}') })
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive "core\$zip" -DestinationPath core-staged -Force
          "CORE_TAG=$($rel.tag_name)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: 'Phase 1 (ABSENT): the refusal contract - driver verb AND scan verb'
        shell: pwsh
        run: |
          $rrecov = "core-staged\bin\rrecov.exe"
          if (-not (Test-Path $rrecov)) { Write-Host "::error::staged core missing rrecov.exe"; exit 1 }
          # PATH for the app-local runtime (vcpkg dlls sit beside the exe)
          $env:PATH = "$PWD\core-staged\bin;$env:PATH"

          # the driver verb: exit 4, the ABSENT class, facets all false.
          # (error_code prints DECIMAL in the JSON: 1342898177 == 0x500B0001)
          $out = & $rrecov driver --json 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 4) { Write-Host "::error::driver verb: expected exit 4 (absent), got $code"; exit 1 }
          if (-not ($out -match '"state":"absent"')) { Write-Host "::error::driver verb: expected state absent"; exit 1 }
          if (-not ($out -match '"error_code":1342898177')) { Write-Host "::error::driver verb: expected ERR_DRIVER_ABSENT (0x500B0001) class surfaced"; exit 1 }

          # the scan verb: refusal is the WHOLE response (stderr, exit 4,
          # no scan output, no progress)
          $scanOut = & $rrecov scan --disk 0 2>&1
          $scanCode = $LASTEXITCODE
          $scanOut | Write-Host
          if ($scanCode -ne 4) { Write-Host "::error::scan verb: expected exit 4 refusal, got $scanCode"; exit 1 }
          if (-not ($scanOut -match 'driver required')) { Write-Host "::error::scan refusal must name the driver requirement"; exit 1 }
          if ($scanOut -match 'starting scan|stage|progress|\[transport\]') {
            Write-Host "::error::the refusal must be the whole response - no scan-phase output allowed"; exit 1
          }
          Write-Host "PHASE 1 (ABSENT): refusal contract verified - exit 4, ERR_DRIVER_ABSENT, no scan output"

      # ---- phase 2: READY (install via the shared composite) ----
      - name: Install the prebuilt driver (fetch + verify + test-sign + service)
        uses: ./.github/actions/install-driver
        with:
          service: rda
          driver_dir: driver
          tag: ${{ inputs.driver_tag }}

      - name: 'Phase 2 (READY): every facet green + a staged-disk scan proceeds'
        shell: pwsh
        run: |
          $rrecov = "core-staged\bin\rrecov.exe"
          $env:PATH = "$PWD\core-staged\bin;$env:PATH"
          $out = & $rrecov driver --json 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) { Write-Host "::error::driver verb: expected exit 0 (ready), got $code"; exit 1 }
          foreach ($facet in @('"present":"yes"','"loaded":"yes"','"started":"yes"',
                               '"authorized":"yes"','"healthy":"yes"')) {
            if (-not ($out -match [regex]::Escape($facet))) {
              Write-Host "::error::facet not green: $facet"; exit 1
            }
          }
          if (-not ($out -match '"state":"ready"')) { Write-Host "::error::expected state ready"; exit 1 }
          & $rrecov driver > driver-status-ready.txt
          Get-Content driver-status-ready.txt | Write-Host
          # the scan proceeds past the gate (it will fail later for lack of a
          # usable disk target - any rc EXCEPT 4 proves the gate passed)
          $scan = & $rrecov scan --disk 99 2>&1   # disk 99 does not exist
          $scanCode = $LASTEXITCODE
          $scan | Write-Host
          if ($scanCode -eq 4) { Write-Host "::error::scan refused with a DRIVER class on a Ready driver - a target error was expected"; exit 1 }
          Write-Host "PHASE 2 (READY): all facets green; scan proceeds past the driver gate (target rc=$scanCode)"

      # ---- phase 3: NOT_STARTED (service stopped) ----
      - name: 'Phase 3 (NOT_STARTED): the stopped-service refusal class'
        shell: pwsh
        run: |
          sc.exe stop rda | Out-Null
          Start-Sleep -Seconds 2
          $rrecov = "core-staged\bin\rrecov.exe"
          $env:PATH = "$PWD\core-staged\bin;$env:PATH"
          $out = & $rrecov driver --json 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 4) { Write-Host "::error::driver verb: expected exit 4 (not-started), got $code"; exit 1 }
          if (-not ($out -match '"state":"not-started"')) { Write-Host "::error::expected state not-started"; exit 1 }
          if (-not ($out -match '"error_code":1342898178')) { Write-Host "::error::expected ERR_DRIVER_NOT_STARTED (0x500B0002) class surfaced"; exit 1 }
          Write-Host "PHASE 3 (NOT_STARTED): refusal class verified"

      - name: Evidence + env manifest
        if: always()
        shell: pwsh
        run: |
          $driverTag = '<not-fetched>'
          if (Test-Path driver\resolved-release.json) {
            $driverTag = (Get-Content driver\resolved-release.json -Raw | ConvertFrom-Json).tag
          }
          [ordered]@{
            runner_image  = $env:ImageOS
            toolchain     = "MSVC on runner; core $env:CORE_TAG"
            driver_tag    = $driverTag
            core_tag      = $env:CORE_TAG
            phases        = 'absent -> ready -> not-started (S-DRV-REFUSE)'
          } | ConvertTo-Json | Set-Content env-manifest.json
          Get-Content env-manifest.json | Write-Host

      - name: Uninstall the driver (always - leave the runner clean)
        if: always()
        shell: pwsh
        run: |
          sc.exe stop rda 2>$null | Out-Null
          sc.exe delete rda 2>$null | Out-Null
          Remove-Item "$env:SystemRoot\System32\drivers\rda.sys" -Force -ErrorAction SilentlyContinue

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-install-evidence-${{ github.run_id }}
          path: |
            env-manifest.json
            driver\resolved-release.json
            core\resolved-release.json
            driver-status-ready.txt
          if-no-files-found: error
