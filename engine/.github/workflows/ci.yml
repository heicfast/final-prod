name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18 > /dev/null
          find src include tests -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.c' \
            | xargs clang-format-18 --dry-run --Werror

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev libgtest-dev > /dev/null
      - name: Configure + build + test (pure core, ASan)
        run: |
          cmake --preset linux-gcc
          cmake --build --preset linux-gcc -j"$(nproc)"
          ctest --preset linux-gcc

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build (Debug + Release, manifest vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "vcpkg at: $env:VCPKG_ROOT"
          cmake --preset win-x64-debug
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset win-x64-debug
          if ($LASTEXITCODE) { exit 1 }
          cmake --preset win-x64-release
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset win-x64-release
          if ($LASTEXITCODE) { exit 1 }
      - name: Tests
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          ctest --preset win-x64-release -C Release

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install clang + zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev > /dev/null
      - name: build fuzzers
        run: make -C fuzz all CXX=clang++
      - name: smoke campaign (45s per target, zero-crash gate)
        run: make -C fuzz run CXX=clang++
      - name: upload corpus on crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-corpus
          path: |
            fuzz/corpus
            fuzz/build/*crash*
            fuzz/build/*leak*
            fuzz/build/*timeout*
          retention-days: 7
          if-no-files-found: ignore

  codeql:
    runs-on: windows-2022
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
      - shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake -S . -B build/codeql -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE) { exit 1 }
          cmake --build build/codeql --config Release
          if ($LASTEXITCODE) { exit 1 }
      - uses: github/codeql-action/analyze@v3
