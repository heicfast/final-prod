name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: clang-format check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18 > /dev/null
          find src include tests -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.c' \
            | xargs clang-format-18 --dry-run --Werror

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev liblz4-dev libzstd-dev libgtest-dev > /dev/null
      - name: Configure + build + test (pure core, ASan)
        run: |
          cmake --preset linux-gcc
          cmake --build --preset linux-gcc -j"$(nproc)"
          ctest --preset linux-gcc

      - name: Recovery report schema validation (G-09)
        run: |
          # the Report.EmitsCiSchemaSample test writes the sample above
          # (GAP-CI-1: the path now resolves through the platform temp
          # dir - tempfile.gettempdir() is the exact std::filesystem
          # resolution on this runner)
          python3 tools/validate_report.py "$(python3 -c 'import tempfile; print(tempfile.gettempdir())')/cr_report_sample.json"

  linux-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev liblz4-dev libzstd-dev libgtest-dev > /dev/null
      - name: Configure + build + test (pure core, TSan)
        run: |
          # ThreadSanitizer pass (session-5 audit row 48): the scan fans
          # engine work over the ThreadPool (remnant sweep, carve windows,
          # lost candidates, LDM volumes) - data races must fail CI.
          cmake -S . -B build/tsan -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCR_ENABLE_ASAN=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fPIE" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -pie" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/tsan -j"$(nproc)"
          cd build/tsan && ctest --output-on-failure -j2

  linux-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev liblz4-dev libzstd-dev libgtest-dev > /dev/null
      - name: Configure + build + test (full suite, UBSan)
        run: |
          cmake -S . -B build/ubsan -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCR_ENABLE_ASAN=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=undefined"
          cmake --build build/ubsan -j"$(nproc)"
          cd build/ubsan && UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --output-on-failure -j2

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure + build (Debug + Release, manifest vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "vcpkg at: $env:VCPKG_ROOT"
          cmake --preset win-x64-debug
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset win-x64-debug
          if ($LASTEXITCODE) { exit 1 }
          cmake --preset win-x64-release
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset win-x64-release
          if ($LASTEXITCODE) { exit 1 }
      - name: Diagnostics - deployed DLLs + PE imports
        # Evidence trail for the 0xc0000135 class of failures: what the
        # vcpkg tree contains, what actually sits next to the exes, and
        # what the exes import. Printed to the log for offline analysis.
        # ALWAYS runs - the whole point is post-mortem on failed builds.
        if: always()
        shell: pwsh
        run: |
          Write-Host "== vcpkg installed bin trees =="
          Get-ChildItem build\win-x64-debug\vcpkg_installed -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName | Write-Host
          Write-Host "== deployed next to Debug exes =="
          Get-ChildItem build\win-x64-debug\tests\Debug, build\win-x64-debug\src\app\Debug -Filter *.dll -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Write-Host
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($dumpbin) {
            Write-Host "== cr_tests.exe imports =="
            & $dumpbin.FullName /imports build\win-x64-debug\tests\Debug\cr_tests.exe |
              Select-String -Pattern "DLL name|\.dll" | Select-Object -First 30 | Write-Host
            Write-Host "== rrecov.exe imports =="
            & $dumpbin.FullName /imports build\win-x64-debug\src\app\Debug\rrecov.exe |
              Select-String -Pattern "DLL name|\.dll" | Select-Object -First 30 | Write-Host
          }
      - name: Win7 posture gate (stamp + import allowlist)
        # GAP-W6-WIN7 / F-D-4: the Win7 SP1 -> Win11 envelope is now
        # machine-verified like the driver repo. The stamper rewrites the
        # PE OS/subsystem version fields to 6.1 (the modern toolset links
        # 10.0 regardless of project flags); the gate then fails on any
        # kernel32/advapi32 import outside tools/ref_imports_um.json plus
        # the audited additions - a conscious allowlist update is the only
        # way a new import lands.
        shell: pwsh
        run: |
          python tools/stamp_osversion_um.py build\win-x64-release\src\app\Release\rrecov.exe
          if ($LASTEXITCODE) { exit 1 }
          python tools/stamp_osversion_um.py build\win-x64-release\tests\Release\cr_tests.exe
          if ($LASTEXITCODE) { exit 1 }
          python tools/stamp_osversion_um.py build\win-x64-release\src\ui\Release\cr_ui.dll
          if ($LASTEXITCODE) { exit 1 }
          python tools/verify_pe_um.py build\win-x64-release\src\app\Release\rrecov.exe --allowlist tools/ref_imports_um.json
          if ($LASTEXITCODE) { exit 1 }
          python tools/verify_pe_um.py build\win-x64-release\tests\Release\cr_tests.exe --allowlist tools/ref_imports_um.json
          if ($LASTEXITCODE) { exit 1 }
          python tools/verify_pe_um.py build\win-x64-release\src\ui\Release\cr_ui.dll --allowlist tools/ref_imports_um.json
          if ($LASTEXITCODE) { exit 1 }
      - name: Tests
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          ctest --preset win-x64-release -C Release

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install clang + zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev liblz4-dev libzstd-dev > /dev/null
      - name: build fuzzers
        run: make -C fuzz all CXX=clang++
      - name: smoke campaign (45s per target, zero-crash gate)
        run: make -C fuzz run CXX=clang++
      - name: upload corpus on crash
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-corpus
          path: |
            fuzz/corpus
            fuzz/build/*crash*
            fuzz/build/*leak*
            fuzz/build/*timeout*
          retention-days: 7
          if-no-files-found: ignore

  codeql:
    runs-on: windows-2022
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          languages: cpp
      - shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake -S . -B build/codeql -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE) { exit 1 }
          cmake --build build/codeql --config Release
          if ($LASTEXITCODE) { exit 1 }
      - uses: github/codeql-action/analyze@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
