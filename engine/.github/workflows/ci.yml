# ci.yml - the PRE-MERGE VALIDATION LANE (rebuilt, driver-only session).
#
# Charter (PLAN-CI-REBUILD section 3.1): this lane's subject IS THE SOURCE -
# it is the one from-scratch build besides the release workflow, because
# warnings-as-errors validation, sanitizers and unit truth must run against
# the exact tree being merged. Every OTHER workflow consumes prebuilt
# releases (docs/PREBUILT-ARTIFACTS.md). The cost reasons, documented once:
#   - local-mirror: runs the SAME entry point developers run (ci-local.ps1)
#     - fail fast if local validation does not reproduce on the runner image
#   - ONE Windows Release build (the double Debug+Release build of the old
#     lane is gone: the validation subject is the source, one configuration
#     suffices, and the release workflow rebuilds from tag anyway)
#   - sanitizer lanes + fuzz + abi-check unchanged in scope
#
# Also invoked via workflow_call by release.yml as the validation gate
# (no release without green).
name: CI (validation lane)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'worklog.md', 'worklog/**', 'AUDIT*.md']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'worklog.md', 'worklog/**', 'AUDIT*.md']
  workflow_call: {}

permissions:
  contents: read

jobs:
  # ---- THE LOCAL MIRROR: the first job runs what developers run ----
  # (mandate section 6: CI's first job is not "build everything from
  # scratch" - it is "run the same local entry point on the runner image
  # and fail fast if the local validation does not reproduce".)
  local-mirror:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The local validation entry point, verbatim (ci-local.ps1)
        shell: pwsh
        run: |
          pip install clang-format 2>$null | Out-Null
          .\ci-local.ps1
      - name: Hooks present in-tree (the --check the mandate asks for)
        shell: pwsh
        run: |
          foreach ($h in @('.githooks\pre-commit', '.githooks\pre-push', 'ci-local.ps1', 'ci-local.sh')) {
            if (-not (Test-Path $h)) { Write-Host "::error::missing local-gate file: $h"; exit 1 }
          }
          Write-Host "local gate files present in-tree"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev liblz4-dev libzstd-dev libgtest-dev > /dev/null
      - name: Configure + build + test (pure core, ASan)
        run: |
          cmake --preset linux-gcc
          cmake --build --preset linux-gcc -j"$(nproc)"
          ctest --preset linux-gcc

      - name: Recovery report schema validation (G-09)
        run: |
          python3 tools/validate_report.py "$(python3 -c 'import tempfile; print(tempfile.gettempdir())')/cr_report_sample.json"

      - name: Win7 PE gate self-test (GAP-W6-WIN7)
        run: |
          python3 tools/test_verify_pe_um.py

  linux-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev liblz4-dev libzstd-dev libgtest-dev > /dev/null
      - name: Configure + build + test (pure core, TSan)
        run: |
          # ThreadSanitizer pass (session-5 audit row 48): the scan fans
          # engine work over the ThreadPool - data races must fail CI.
          cmake -S . -B build/tsan -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCR_ENABLE_ASAN=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fPIE" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -pie" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/tsan -j"$(nproc)"
          cd build/tsan && ctest --output-on-failure -j2

  linux-ubsan:
    # N-018: UBSan lane - -fno-sanitize-recover=undefined makes every UB
    # diagnostic fatal: the suite must pass with zero UB.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev liblz4-dev libzstd-dev libgtest-dev > /dev/null
      - name: Configure + build + test (pure core, UBSan)
        run: |
          cmake --preset linux-ubsan
          cmake --build --preset linux-ubsan -j"$(nproc)"
          ctest --preset linux-ubsan -j2

  windows:
    # ONE from-scratch MSVC Release build (the old lane built the tree
    # TWICE - Debug and Release; the validation subject is the source, one
    # configuration suffices; the release workflow rebuilds from tag).
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build (Release, manifest vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          Write-Host "vcpkg at: $env:VCPKG_ROOT"
          cmake --preset win-x64-release
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset win-x64-release
          if ($LASTEXITCODE) { exit 1 }
      - name: Win7 posture gate (stamp + import allowlist)
        shell: pwsh
        run: |
          python tools/stamp_osversion_um.py build\win-x64-release\src\app\Release\rrecov.exe
          if ($LASTEXITCODE) { exit 1 }
          python tools/stamp_osversion_um.py build\win-x64-release\tests\Release\cr_tests.exe
          if ($LASTEXITCODE) { exit 1 }
          python tools/stamp_osversion_um.py build\win-x64-release\src\ui\Release\cr_ui.dll
          if ($LASTEXITCODE) { exit 1 }
          python tools/verify_pe_um.py build\win-x64-release\src\app\Release\rrecov.exe --allowlist tools/ref_imports_um.json
          if ($LASTEXITCODE) { exit 1 }
          python tools/verify_pe_um.py build\win-x64-release\tests\Release\cr_tests.exe --allowlist tools/ref_imports_um.json
          if ($LASTEXITCODE) { exit 1 }
          python tools/verify_pe_um.py build\win-x64-release\src\ui\Release\cr_ui.dll --allowlist tools/ref_imports_um.json
          if ($LASTEXITCODE) { exit 1 }
      - name: Tests (full ctest incl. the cr_ui ABI lane)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          ctest --preset win-x64-release -C Release

  fuzz:
    # the 45s/target smoke budget from the Makefile; crash corpus uploaded
    # on failure.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install clang + zlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev liblz4-dev libzstd-dev > /dev/null
      - name: build fuzzers
        run: make -C fuzz all CXX=clang++
      - name: smoke campaign (45s per target, zero-crash gate)
        run: make -C fuzz run CXX=clang++
      - name: upload corpus on crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-corpus
          path: |
            fuzz/corpus
            fuzz/build/*crash*
            fuzz/build/*leak*
            fuzz/build/*timeout*
          retention-days: 7
          if-no-files-found: ignore

  codeql:
    # bench-session skip (recorded, not silent - the repo's own posture)
    if: false
    runs-on: windows-2022
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
      - shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake -S . -B build/codeql -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE) { exit 1 }
          cmake --build build/codeql --config Release
          if ($LASTEXITCODE) { exit 1 }
      - uses: github/codeql-action/analyze@v3
