# install-driver/action.yml - the shared composite: fetch the latest prebuilt
# rda-driver release by the documented convention, verify checksums, test-sign
# with a job-local cert, install + start the service, and leave evidence.
# Extracted from the api-benchmark lane's proven mechanism (runs
# 40227375329 / 40315255368) - PLAN-CI-REBUILD section 3.2.
#
# Inputs:
#   service      - the service name to install under (default 'rda')
#   driver_dir   - where the release is fetched + verified (default 'driver')
#   tag          - explicit tag pin (empty = latest by convention)
#   allow_fallback - permit the manual sc.exe fallback when install.ps1
#                    fails (default 'false' - S-036: fail loud; the fallback
#                    historically masked the elevation-guard crash)
#   timestamp_server - optional RFC3161 TSA for the test-sign step (default ''
#                    - the job-local cert outlives the job, so a timestamp is
#                    unnecessary in CI; set it for any cert that must outlive
#                    its validity window - N-084)
#
# Outputs:
#   driver-tag   - the resolved release tag (for the env-manifest)
#
# The composite installs and STARTS the driver via the release's own
# install.ps1 (v0.2.3+ carries the exit-code contract: start failure is
# fatal with exit 6 + the testsigning guidance); the caller performs the
# core-based verification (rrecov driver --json -> state ready) after staging
# the core release, and MUST run the release's uninstall.ps1 (always) at job
# end - it carries the verified-teardown contract (M-061):
#   pwsh -File driver\uninstall.ps1 -ServiceName rda; exit $LASTEXITCODE
name: 'install-prebuilt-rda-driver'
description: >
  Fetch the latest prebuilt rda-driver release by the documented convention,
  verify SHA256SUMS, test-sign with a job-local certificate, install as a
  kernel service and start it. No build. Loud failure on convention violation.
inputs:
  service:
    description: 'service name to install under'
    default: 'rda'
  driver_dir:
    description: 'directory for the fetched release'
    default: 'driver'
  tag:
    description: 'explicit tag pin (empty = latest by convention)'
    default: ''
  allow_fallback:
    description: 'permit the manual sc.exe fallback when install.ps1 fails (default: fail loud)'
    default: 'false'
  timestamp_server:
    description: 'optional RFC3161 TSA for the test-sign step (empty = none, N-084)'
    default: ''
outputs:
  driver-tag:
    description: 'the resolved release tag'
    value: ${{ steps.resolve.outputs.tag }}

runs:
  using: 'composite'
  steps:
    - id: resolve
      name: Fetch + verify the prebuilt driver release (convention-enforced)
      shell: pwsh
      run: |
        # expression-bound parameters (the $args-array token form binds
        # -Required's values positionally and fails); -Required accepts the
        # comma-joined string form in the script
        $req = 'rda.sys,rda.inf,install.ps1,uninstall.ps1,SHA256SUMS'
        if ('${{ inputs.tag }}') {
          & .github/scripts/fetch-release.ps1 -Repo heicfast/rda-driver -OutDir '${{ inputs.driver_dir }}' `
            -Required $req -FloorVersion v0.2.3 -Tag '${{ inputs.tag }}'
        } else {
          & .github/scripts/fetch-release.ps1 -Repo heicfast/rda-driver -OutDir '${{ inputs.driver_dir }}' `
            -Required $req -FloorVersion v0.2.3
        }
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $rec = Get-Content '${{ inputs.driver_dir }}\resolved-release.json' -Raw | ConvertFrom-Json
        "tag=$($rec.tag)" >> $env:GITHUB_OUTPUT

    - name: Test-sign + install + start the driver (service '${{ inputs.service }}')
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # job-local code-signing cert (the proven runner mechanism: no
        # test-signing boot mode required on windows-2022)
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=RRECOV-CI" `
          -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(2) `
          -CertStoreLocation Cert:\LocalMachine\My
        $pw = ConvertTo-SecureString -String 'rrecov-ci' -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath rda-ci.pfx -Password $pw | Out-Null
        Export-Certificate -Cert $cert -FilePath rda-ci.cer | Out-Null
        Import-Certificate -FilePath rda-ci.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
        Import-Certificate -FilePath rda-ci.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1
        # N-084: the timestamp is optional-by-design in CI (the job-local
        # cert outlives the job); a caller-supplied TSA covers any cert that
        # must be verifiable past its validity window
        if ('${{ inputs.timestamp_server }}') {
          & $signtool.FullName sign /fd SHA256 /tr '${{ inputs.timestamp_server }}' /td SHA256 `
            /f rda-ci.pfx /p rrecov-ci '${{ inputs.driver_dir }}\rda.sys'
        } else {
          & $signtool.FullName sign /fd SHA256 /f rda-ci.pfx /p rrecov-ci '${{ inputs.driver_dir }}\rda.sys'
        }
        if ($LASTEXITCODE -ne 0) { exit 1 }
        # the release's own installer - v0.2.3+ exit-code contract: 6 = start
        # failure (code-signing rejection) with the testsigning guidance
        powershell -ExecutionPolicy Bypass -File '${{ inputs.driver_dir }}\install.ps1' `
          -ServiceName '${{ inputs.service }}' -Source "$PWD\${{ inputs.driver_dir }}\rda.sys" -IoctlBase 0
        if ($LASTEXITCODE -ne 0) {
          # S-036: fail LOUD on installer failure - the documented installer
          # is the only supported path; the manual sc.exe fallback that
          # masked the pre-v0.2.3 elevation-guard crash is now opt-in only
          # (allow_fallback) and, when taken, configures the service exactly
          # like install.ps1 does (M-060: 'Boot File System' group, absolute
          # binPath, the four Parameters values, sc qc + reg assertions).
          if ('${{ inputs.allow_fallback }}' -ne 'true') {
            Write-Host "::error::install.ps1 failed (exit $LASTEXITCODE) - the documented installer must work (v0.2.3 exit-code contract); the manual fallback is disabled by default (S-036/M-060)"
            exit 1
          }
          Write-Host "install.ps1 failed ($LASTEXITCODE) - manual sc.exe fallback (allow_fallback=true, M-060 parity shape)"
          $dest = "$env:SystemRoot\System32\drivers\${{ inputs.service }}.sys"
          Copy-Item '${{ inputs.driver_dir }}\rda.sys' $dest -Force
          # M-060: install.ps1's exact profile - the og's group (regdrv.reg
          # + install.ps1: 'Boot File System', NOT the invented FSFilter
          # variant), the ABSOLUTE binPath, and the four Parameters values
          sc.exe create ${{ inputs.service }} type= kernel start= demand binPath= "$dest" group= "Boot File System"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $paramKey = "HKLM:\SYSTEM\CurrentControlSet\Services\${{ inputs.service }}\Parameters"
          New-Item -Path $paramKey -Force | Out-Null
          Set-ItemProperty -Path $paramKey -Name 'IoctlBase' -Value 0 -Type DWord
          Set-ItemProperty -Path $paramKey -Name 'MaxDisks' -Value 200 -Type DWord
          Set-ItemProperty -Path $paramKey -Name 'DebugLevel' -Value 1 -Type DWord
          Set-ItemProperty -Path $paramKey -Name 'SessionsEnabled' -Value 1 -Type DWord
        }
        # M-060: assert the service config on BOTH paths - the group from
        # sc qc and the four Parameters values; a divergence here is a
        # silently misconfigured driver (the finding's own failure mode)
        $qc = sc.exe qc ${{ inputs.service }} | Select-String 'Boot File System'
        if (-not $qc) { Write-Host "::error::service group is not 'Boot File System' (sc qc)"; exit 1 }
        $params = Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\${{ inputs.service }}\Parameters"
        if ($params.IoctlBase -ne 0 -or $params.MaxDisks -ne 200 -or $params.DebugLevel -ne 1 -or $params.SessionsEnabled -ne 1) {
          Write-Host "::error::Parameters key incomplete: IoctlBase=$($params.IoctlBase) MaxDisks=$($params.MaxDisks) DebugLevel=$($params.DebugLevel) SessionsEnabled=$($params.SessionsEnabled)"
          exit 1
        }
        # v0.2.4 installers start the service themselves (the M-064 batch
        # made -NoStart opt-out); the start is now IDEMPOTENT - error 1056
        # ("an instance of the service is already running") after a
        # successful install means the installer already started it, which
        # is the contract's own success shape. Any other start failure
        # stays fatal (the v0.2.3 exit-code lesson: never exit 0 on it).
        $already = sc.exe query ${{ inputs.service }} 2>$null | Select-String 'RUNNING'
        if (-not $already) {
          sc.exe start ${{ inputs.service }}
          if ($LASTEXITCODE -ne 0) {
            sc.exe query ${{ inputs.service }}
            Get-WinEvent -LogName System -MaxEvents 30 | Format-List | Out-String | Write-Host
            exit 1
          }
        } else {
          Write-Host "service '${{ inputs.service }}' already RUNNING (the v0.2.4 installer starts it) - start step skipped"
        }
        # layer-1 evidence: service RUNNING + control device opens
        $svc = sc.exe query ${{ inputs.service }} | Select-String 'RUNNING'
        if (-not $svc) { Write-Host "service not RUNNING after start"; exit 1 }
        $h = [IO.File]::Open('\\.\${{ inputs.service }}', 'Open', 'Read', 'ReadWrite')
        $h.Close()
        Write-Host "driver installed: service RUNNING + control device open OK"
